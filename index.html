<script>
// ===== MINDANCE STABLE FIX 08 =====
// Teacher personal-pay confirmation + explicit student balance payment.

window.mdTeacherConfirmExpensePaid=async function(id){
  if(!confirm('Xác nhận bạn đã thực sự thanh toán khoản này cho học viên?'))return;
  const {error}=await supa.rpc('teacher_confirm_personal_expense_paid',{p_claim_id:id});
  if(error)return alert(error.message);
  alert('✅ Đã xác nhận thanh toán. Học viên đã nhận thông báo trong MinDance.');
  mdTeacherExpenses();
};

window.mdTeacherExpenses=async function(){
  const {data,error}=await supa.rpc('teacher_list_expense_claims',{p_status:null});
  if(error)return alert(error.message);
  const rows=data||[];
  const unresolved=rows.filter(x=>x.status==='pending_teacher');
  const awaiting=rows.filter(x=>x.status==='teacher_personal_pay'&&!x.personal_payment_confirmed_at);
  const done=rows.filter(x=>x.status!=='pending_teacher'&&!(x.status==='teacher_personal_pay'&&!x.personal_payment_confirmed_at));

  const card=x=>{
    const personal=x.status==='teacher_personal_pay';
    const confirmed=!!x.personal_payment_confirmed_at;
    return `<div class="item">
      <div class="row">
        <div>
          <b>${esc(x.student_name)} · ${esc(x.class_name)}</b>
          <div class="small muted">${v12DateVN(x.expense_date)} · ${esc(x.expense_title)}</div>
          <div style="font-size:1.35rem;font-weight:800;margin-top:5px">${mdMoney(x.amount)}</div>
        </div>
        ${x.status==='pending_teacher'
          ? '<span class="badge warn">Chờ xử lý</span>'
          : personal&&!confirmed
            ? '<span class="badge danger">CHƯA THANH TOÁN</span>'
            : personal&&confirmed
              ? '<span class="badge ok">✓ ĐÃ THANH TOÁN</span>'
              : '<span class="badge ok">Trừ lương GV / giảm học phí</span>'}
      </div>

      ${x.status==='pending_teacher'?`<div class="grid" style="margin-top:9px">
        <button class="btn" onclick="mdResolveExpense('${x.id}','personal_pay')">GV tự thanh toán</button>
        <button class="btn primary" onclick="mdResolveExpense('${x.id}','salary_deduct')">Trừ lương / giảm học phí</button>
      </div>`:''}

      ${personal&&!confirmed?`<div class="notice danger" style="margin-top:9px">
        <b>⚠️ Bạn đã chọn tự thanh toán nhưng chưa xác nhận đã trả tiền.</b>
        <div class="small">Khoản này sẽ tiếp tục được đánh dấu đỏ cho tới khi bạn xác nhận.</div>
        <button class="btn primary full" style="margin-top:8px" onclick="mdTeacherConfirmExpensePaid('${x.id}')">✓ Xác nhận đã thanh toán</button>
      </div>`:''}

      ${personal&&confirmed?`<div class="notice ok" style="margin-top:9px"><b>✓ Đã thanh toán cho học viên</b><div class="small">Học viên đã được gửi thông báo xác nhận.</div></div>`:''}
    </div>`;
  };

  $('content').innerHTML=`<div class="card">
    <div class="row"><div><h2>🧾 Khoản chi học viên</h2><div class="muted">${unresolved.length} khoản chờ xử lý · ${awaiting.length} khoản chưa xác nhận thanh toán</div></div><button class="btn" onclick="openHome()">Quay lại</button></div>
    <div class="notice"><b>Hai cách xử lý:</b><br>• <b>Tự thanh toán:</b> sau khi chọn, bạn phải xác nhận khi đã thực sự trả tiền cho học viên.<br>• <b>Trừ lương:</b> MinDance ghi giảm lương và giảm học phí tương ứng.</div>
  </div>
  ${awaiting.length?`<div class="card" style="border:2px solid #d33"><h2>🔴 Chưa xác nhận đã thanh toán</h2>${awaiting.map(card).join('')}</div>`:''}
  ${unresolved.length?`<div class="card"><h2>Chờ bạn xử lý</h2>${unresolved.map(card).join('')}</div>`:''}
  ${done.length?`<div class="card"><h2>Đã xử lý</h2>${done.map(card).join('')}</div>`:''}
  ${!rows.length?'<div class="card"><div class="muted">Chưa có khoản chi nào.</div></div>':''}`;
};

window.mdStudentPayBalance=async function(purchaseId){
  if(!confirm('Dùng số dư hiện có để thanh toán khoản học phí này?'))return;
  const {data,error}=await supa.rpc('student_pay_purchase_with_balance',{p_purchase_id:purchaseId});
  if(error)return alert(error.message);
  const paid=Number(data?.paid||0), rem=Number(data?.remaining_due||0), bal=Number(data?.balance||0);
  alert(`✅ Đã dùng ${mdMoney(paid)} từ số dư.\nSố dư còn lại: ${mdMoney(bal)}${rem>0?`\nHọc phí còn thiếu: ${mdMoney(rem)}`:'\nKhoản học phí đã thanh toán đủ.'}`);
  v124PaymentsChooser();
};

// Student tuition screen: QR OR balance. No student cash confirmation.
window.v124PaymentsChooser=async function(){
  const {students,student}=await mdFocusedStudent();
  if(!student)return alert('Chưa có hồ sơ học viên.');

  const [{data:purchases,error:pe},{data:ledger,error:le}]=await Promise.all([
    supa.from('package_purchases').select('id,student_id,package_name_snapshot,price_snapshot,status,created_at').eq('student_id',student.id).neq('status','cancelled').order('created_at',{ascending:false}),
    supa.from('student_credit_ledger').select('amount').eq('student_id',student.id)
  ]);
  if(pe||le)return alert((pe||le).message);

  const ids=(purchases||[]).map(x=>x.id);
  let pay=[];
  if(ids.length){
    const {data,error}=await supa.from('payments').select('purchase_id,amount').in('purchase_id',ids);
    if(error)return alert(error.message);
    pay=data||[];
  }
  const paidMap={}; pay.forEach(x=>paidMap[x.purchase_id]=(paidMap[x.purchase_id]||0)+Number(x.amount||0));
  const balance=(ledger||[]).reduce((a,x)=>a+Number(x.amount||0),0);

  const cards=(purchases||[]).map(x=>{
    const price=Number(x.price_snapshot||0), paid=Number(paidMap[x.id]||0), due=Math.max(price-paid,0);
    return {...x,paid,due};
  }).filter(x=>x.due>0 || x.status==='active');

  $('content').innerHTML=`<div class="card">
    <div class="row"><div><h2>Học phí · ${esc(student.full_name)}</h2><div class="muted">Chỉ hiển thị gói đang hoạt động hoặc còn nợ.</div></div><button class="btn" onclick="openHome()">Quay lại</button></div>
    ${students.length>1?`<label>Học viên</label><select onchange="localStorage.setItem(mdStudentFocusKey(),this.value);v124PaymentsChooser()">${students.map(s=>`<option value="${s.id}" ${s.id===student.id?'selected':''}>${esc(s.full_name)}</option>`).join('')}</select>`:''}
    <div class="notice ${balance>0?'ok':''}" style="margin-top:10px"><b>💰 Số dư hiện có: ${mdMoney(balance)}</b><div class="small">Số dư chỉ bị trừ khi bạn chủ động chọn “Thanh toán bằng số dư”.</div></div>
  </div>

  ${cards.map(x=>`<div class="card">
    <div class="row">
      <div><h2 style="font-size:1.15rem">${esc(x.package_name_snapshot||'Gói học')}</h2><div class="muted">Đã thu ${mdMoney(x.paid)} · còn ${mdMoney(x.due)}</div></div>
      <span class="badge ${x.due>0?'warn':'ok'}">${x.due>0?'Còn nợ':'Đã đủ'}</span>
    </div>
    ${x.due>0?`<div class="stack" style="margin-top:10px">
      <button class="btn primary full" onclick="v124OpenQR('${x.id}')">📱 QR thanh toán</button>
      <button class="btn full" ${balance<=0?'disabled':''} onclick="mdStudentPayBalance('${x.id}')">💰 Thanh toán bằng số dư${balance>0?' · '+mdMoney(balance):' · Không có số dư'}</button>
      <div class="small muted" style="text-align:center">💵 Tiền mặt chỉ Admin mới có quyền xác nhận.</div>
    </div>`:'<div class="notice ok" style="margin-top:10px">✓ Khoản học phí đã thanh toán đủ.</div>'}
  </div>`).join('')||'<div class="card"><div class="muted">Không có khoản học phí đang hoạt động hoặc còn nợ.</div></div>'}`;
};

document.title='MinDance STABLE FIX 08';
window.MINDANCE_RELEASE='STABLE_FIX_08';
</script>

<script>
// ===== MINDANCE STABLE FIX 10 =====
// Consolidated:
// 1) Student sees teacher-paid/support notifications in-app.
// 2) Student attendance is compact + class drilldown.
// 3) Quick chat Student/Parent <-> Admin.
// 4) Balance payment uses secure tuition snapshot RPC only.

// ---------- Notices ----------
window.mdStudentNoticeAction=async function(id,type){
  await supa.rpc('student_mark_notice_read',{p_notification_id:id});
  if(type==='support_reply') return mdStudentSupport();
  return openHome();
};

window.mdStudentUnreadNotices=async function(){
  const {data,error}=await supa.rpc('student_notice_feed',{p_limit:20});
  if(error)return [];
  return (data||[]).filter(x=>!x.read && ['teacher_expense_paid','support_reply','tuition_reminder'].includes(x.type));
};

window.mdRenderStudentNoticeStrip=async function(){
  if(!['student'].includes(profile?.role))return;
  const root=$('content'); if(!root)return;
  const unread=await mdStudentUnreadNotices();
  root.querySelector('[data-md-notices]')?.remove();
  if(!unread.length)return;
  const box=document.createElement('div');
  box.className='card';
  box.setAttribute('data-md-notices','1');
  box.style.border='2px solid #f0b429';
  box.innerHTML=`<div class="row"><div><h2>🔔 Thông báo mới</h2><div class="muted">${unread.length} thông báo chưa đọc</div></div></div>
    ${unread.slice(0,4).map(n=>`<button class="item full" style="text-align:left;margin-top:8px" onclick="mdStudentNoticeAction('${n.id}','${esc(n.type)}')">
      <b>${esc(n.title)}</b>
      <div class="small muted">${esc(n.message)}</div>
    </button>`).join('')}`;
  const first=root.querySelector('.card');
  if(first) first.insertAdjacentElement('afterend',box); else root.prepend(box);
};

// ---------- Quick support chat ----------
window.mdStudentSupport=async function(){
  const {students,student}=await mdFocusedStudent();
  if(!student)return alert('Chưa có hồ sơ học viên.');
  const {data,error}=await supa.rpc('student_support_thread',{p_student_id:student.id});
  if(error)return alert(error.message);
  const rows=data||[];
  $('content').innerHTML=`<div class="card">
    <div class="row"><div><h2>💬 Chat nhanh với Admin</h2><div class="muted">Trao đổi trực tiếp về học phí, lịch học, điểm danh hoặc khiếu nại.</div></div><button class="btn" onclick="openHome()">Quay lại</button></div>
    ${students.length>1?`<label>Học viên</label><select onchange="localStorage.setItem(mdStudentFocusKey(),this.value);mdStudentSupport()">${students.map(s=>`<option value="${s.id}" ${s.id===student.id?'selected':''}>${esc(s.full_name)}</option>`).join('')}</select>`:''}
  </div>
  <div class="card" id="mdSupportMessages" style="max-height:52vh;overflow:auto">
    ${rows.length?rows.map(m=>`<div style="display:flex;justify-content:${m.sender_role==='admin'?'flex-start':'flex-end'};margin:8px 0">
      <div style="max-width:82%;padding:10px 12px;border-radius:14px;background:${m.sender_role==='admin'?'#f1f1f5':'#eee7ff'}">
        <div class="small muted">${m.sender_role==='admin'?'Admin':'Bạn'} · ${new Date(m.created_at).toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</div>
        <div>${esc(m.message)}</div>
      </div>
    </div>`).join(''):'<div class="muted">Chưa có tin nhắn. Bạn có thể gửi vấn đề cho Admin ngay bên dưới.</div>'}
  </div>
  <div class="card">
    <label>Nội dung</label>
    <textarea id="mdSupportText" maxlength="2000" placeholder="Ví dụ: Em muốn hỏi về học phí / xin kiểm tra điểm danh / khiếu nại một khoản..."></textarea>
    <button class="btn primary full" onclick="mdStudentSendSupport()">Gửi cho Admin</button>
  </div>`;
  setTimeout(()=>{const e=$('mdSupportMessages');if(e)e.scrollTop=e.scrollHeight},50);
};

window.mdStudentSendSupport=async function(){
  const {student}=await mdFocusedStudent();
  const msg=$('mdSupportText')?.value?.trim();
  if(!student||!msg)return alert('Vui lòng nhập nội dung.');
  const {error}=await supa.rpc('student_send_support_message',{p_student_id:student.id,p_message:msg,p_subject:'Hỗ trợ nhanh'});
  if(error)return alert(error.message);
  mdStudentSupport();
};

window.mdAdminSupportInbox=async function(){
  const {data,error}=await supa.rpc('admin_support_threads');
  if(error)return alert(error.message);
  const rows=data||[];
  $('content').innerHTML=`<div class="card"><div class="row"><div><h2>💬 Chat học viên</h2><div class="muted">${rows.reduce((a,x)=>a+Number(x.unread_count||0),0)} tin chưa đọc</div></div><button class="btn" onclick="openMore()">Quay lại</button></div></div>

    ${Number(x.unread_count||0)>0?`<span class="badge danger">${x.unread_count}</span>`:`<span class="badge">${x.status==='open'?'Đang mở':'Đã đóng'}</span>`}</div>
  </button>`).join('')||'<div class="card"><div class="muted">Chưa có cuộc trò chuyện nào.</div></div>'}`;
};

window.mdAdminSupportThread=async function(threadId,studentName){
  const {data,error}=await supa.rpc('admin_support_thread',{p_thread_id:threadId});
  if(error)return alert(error.message);
  const rows=data||[];
  $('content').innerHTML=`<div class="card"><div class="row"><div><h2>💬 ${esc(studentName)}</h2><div class="muted">Trao đổi trực tiếp với học viên/phụ huynh</div></div><button class="btn" onclick="mdAdminSupportInbox()">Quay lại</button></div></div>
  <div class="card" id="mdAdminSupportMessages" style="max-height:52vh;overflow:auto">
    ${rows.map(m=>`<div style="display:flex;justify-content:${m.sender_role==='admin'?'flex-end':'flex-start'};margin:8px 0">
      <div style="max-width:82%;padding:10px 12px;border-radius:14px;background:${m.sender_role==='admin'?'#eee7ff':'#f1f1f5'}">
        <div class="small muted">${m.sender_role==='admin'?'Admin':'Học viên'} · ${new Date(m.created_at).toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</div>
        <div>${esc(m.message)}</div>
      </div>
    </div>`).join('')}
  </div>
  <div class="card"><textarea id="mdAdminSupportText" maxlength="2000" placeholder="Nhập phản hồi..."></textarea>
    <button class="btn primary full" onclick="mdAdminSendSupport('${threadId}','${esc(studentName)}')">Gửi trả lời</button>
  </div>`;
  setTimeout(()=>{const e=$('mdAdminSupportMessages');if(e)e.scrollTop=e.scrollHeight},50);

window.mdAdminSendSupport=async function(threadId,studentName){
  const msg=$('mdAdminSupportText')?.value?.trim();
  if(!msg)return alert('Vui lòng nhập nội dung.');
  const {error}=await supa.rpc('admin_send_support_message',{p_thread_id:threadId,p_message:msg});
  if(error)return alert(error.message);
  mdAdminSupportThread(threadId,studentName);
};

// ---------- Compact student attendance ----------
window.mdStudentAttendanceMonth=window.mdStudentAttendanceMonth||new Date().toISOString().slice(0,7);
window.mdStudentAttendanceMove=function(delta){
  const [y,m]=window.mdStudentAttendanceMonth.split('-').map(Number);
  const d=new Date(y,m-1+delta,1);
  window.mdStudentAttendanceMonth=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  openAttendanceHub();
};
window.mdToggleAttClass=function(id){
  const e=document.getElementById('att-'+id); if(!e)return;
  e.style.display=e.style.display==='none'?'block':'none';
};

window.openAttendanceHub=async function(){
  if(!['student'].includes(profile?.role)){
    if(typeof mdAttendanceRoleRouter==='function')return mdAttendanceRoleRouter();
    return;
  }
  const {students,student}=await mdFocusedStudent();
  if(!student)return alert('Chưa có hồ sơ học viên.');
  const month=window.mdStudentAttendanceMonth||new Date().toISOString().slice(0,7);
  const {data,error}=await supa.rpc('student_month_attendance',{p_student_id:student.id,p_month:`${month}-01`});
  if(error)return alert(error.message);
  const rows=data||[];
  const total=rows.reduce((a,x)=>a+Number(x.total_sessions||0),0);
  const present=rows.reduce((a,x)=>a+Number(x.present_count||0),0);
  const late=rows.reduce((a,x)=>a+Number(x.late_count||0),0);
  const absent=rows.reduce((a,x)=>a+Number(x.absent_count||0),0);
  const excused=rows.reduce((a,x)=>a+Number(x.excused_count||0),0);
  const [yy,mm]=month.split('-');

  const statusLabel=s=>s==='present'?'Có mặt':s==='late'?'Đi muộn':(['excused','leave','absent_excused'].includes(s)?'Có phép':'Nghỉ');
  $('content').innerHTML=`<div class="card">

  const sid=$('v125Student')?.value;if(!sid)return;
  const p=(window._v125Class?.packs||[]).find(x=>x.package_id===packageId||x.id===packageId);

  const args=combo?{p_student_id:sid,p_package_id:packageId}:{p_student_id:sid,p_class_id:classId,p_package_id:packageId};

  window._mdRegisterBusy=true;
  const buttons=[...document.querySelectorAll('#content button.primary')];

  try{
    const {data,error}=await supa.rpc(rpc,args);

    if(!r?.purchase_id)return alert('Đã tạo đăng ký nhưng không nhận được mã hóa đơn.');

      price:Number(p?.price||0),

  const amount=Number($('mdTopupAmount')?.value||0);
  const extra=$('mdTopupNote')?.value?.trim()||'';

  if(!confirm(`Xác nhận bạn đã chuyển ${mdMoney(amount)} vào tài khoản trung tâm?`))return;

  const note=`${transferCode}${extra?' · '+extra:''}`;
  const {error}=await supa.rpc('student_submit_credit_claim',{
    p_student_id:studentId,
    p_amount:amount,
    p_method:'bank_transfer',

  alert('✅ Đã gửi yêu cầu. Admin sẽ kiểm tra giao dịch và xác nhận cộng số dư.');

};

  if(!amount || amount<=0)return alert('Số tiền không hợp lệ.');
  const note=prompt('Ghi chú (không bắt buộc):','Nạp số dư bằng tiền mặt')||null;

  const {data,error}=await supa.rpc('admin_add_student_credit_cash',{
    p_student_id:studentId,
    p_amount:amount,
    p_note:note
  });
  if(error)return alert(error.message);

  alert(`✅ Đã cộng ${mdMoney(amount)} vào số dư.\nSố dư mới: ${mdMoney(Number(data?.balance||0))}`);
  if(typeof openStudent==='function')openStudent(studentId);
};

    <div class="row">

      <span class="badge warn">Sắp hết</span>
    </div>

window.mdV2BackupCenter=async function(){

      <div><h2>💾 Sao lưu dữ liệu</h2><div class="muted">Tự động mỗi ngày, giữ 14 ngày. Có thể tạo bản thủ công trước khi thay đổi lớn.</div></div>

window.mdV2CreateBackup=async function(){
  if(!confirm('Tạo bản sao lưu dữ liệu hiện tại?'))return;
  const {error}=await supa.rpc('admin_create_backup_snapshot');
  if(error)return alert(error.message);
  alert('✅ Đã tạo bản sao lưu.');
  mdV2BackupCenter();
};

window.mdV2DownloadBackup=async function(id,date){
  const {data,error}=await supa.rpc('admin_get_backup_snapshot',{p_id:id});
  if(error)return alert(error.message);
  mdV2DownloadJson(`MinDance_backup_${date}.json`,data);
};

window.mdV2BankSecret=null;

window.openBankSettings=async function(){
  if(profile?.role!=='admin')return;
  const [{data:s,error:se},{data:r,error:re}]=await Promise.all([
    supa.from('center_settings').select('id,bank_code,bank_account_no,bank_account_name,payment_prefix,auto_bank_enabled,bank_auto_reconcile_enabled').eq('id',1).single(),
    supa.rpc('admin_bank_reconcile_status')
  ]);
  if(se||re)return alert((se||re).message);

  const endpoint=`${DANCE_CONFIG.SUPABASE_URL}/functions/v1/bank-webhook`;
  $('content').innerHTML=`<div class="card">
    <div class="row"><div><h2>🏦 Ngân hàng & QR</h2><div class="muted">Tài khoản nhận học phí và nạp ví</div></div><button class="btn" onclick="openMore()">Quay lại</button></div>

    <label>Mã ngân hàng / BIN</label><input id="bankCode" value="${esc(s.bank_code||'')}" placeholder="VD: VCB hoặc 970436">
    <label>Số tài khoản</label><input id="bankAccount" value="${esc(s.bank_account_no||'')}">
    <label>Tên chủ tài khoản</label><input id="bankName" value="${esc(s.bank_account_name||'')}">
    <label>Tiền tố mã học phí</label><input id="bankPrefix" value="${esc(s.payment_prefix||'DC')}" maxlength="5">

    <button class="btn primary full" style="margin-top:10px" onclick="mdV2SaveBank()">Lưu tài khoản</button>
  </div>

  <div class="card">
    <div class="row">
      <div><h2>⚡ Đối soát tự động</h2><div class="muted">${r.enabled?'Đang bật':'Đang tắt'} · hôm nay khớp ${r.matched_today||0} giao dịch</div></div>
      <span class="badge ${r.enabled?'ok':'warn'}">${r.enabled?'Bật':'Tắt'}</span>
    </div>

    <div class="item" style="margin-top:10px">
      <div class="small muted">Webhook endpoint</div>
      <b style="word-break:break-all">${esc(endpoint)}</b>
      <button class="btn full" style="margin-top:8px" onclick="navigator.clipboard?.writeText('${esc(endpoint)}')">Sao chép endpoint</button>
    </div>

    <div class="notice" style="margin-top:10px">
      <b>Đã dựng sẵn bộ nhận giao dịch.</b>
      <div class="small">Khi dịch vụ ngân hàng/đối soát gửi giao dịch vào webhook, MinDance tự khớp mã học phí hoặc mã NAP ví, chống ghi nhận trùng và cộng tiền dư vào ví.</div>
    </div>

    ${window.mdV2BankSecret?`<div class="notice warn"><b>Webhook secret mới:</b><div style="word-break:break-all">${esc(window.mdV2BankSecret)}</div><div class="small">Secret chỉ hiển thị trong phiên này. Sao chép sang dịch vụ đối soát.</div></div>`:''}

    <div class="grid" style="margin-top:10px">
      <button class="btn" onclick="mdV2RotateBankSecret()">Tạo/đổi secret</button>
      <button class="btn ${r.enabled?'danger':'primary'}" onclick="mdV2ToggleBankAuto(${!r.enabled})">${r.enabled?'Tắt đối soát':'Bật đối soát'}</button>
    </div>
    ${Number(r.unmatched||0)>0?`<div class="notice warn" style="margin-top:10px">${r.unmatched} giao dịch chưa khớp mã.</div>`:''}
  </div>`;
};

window.mdV2SaveBank=async function(){
  const payload={
    bank_code:($('bankCode').value||'').trim()||null,
    bank_account_no:($('bankAccount').value||'').trim()||null,
    bank_account_name:($('bankName').value||'').trim()||null,
    payment_prefix:v111SafePaymentCode(($('bankPrefix').value||'DC').trim()).slice(0,5)||'DC'
  };
  const {error}=await supa.from('center_settings').update(payload).eq('id',1);
  if(error)return alert(error.message);
  alert('✅ Đã lưu tài khoản ngân hàng.');
  openBankSettings();
};

window.mdV2RotateBankSecret=async function(){
  if(!confirm('Tạo webhook secret mới? Secret cũ sẽ hết hiệu lực.'))return;
  const {data,error}=await supa.rpc('admin_rotate_bank_webhook_secret');
  if(error)return alert(error.message);
  window.mdV2BankSecret=data;
  openBankSettings();
};

window.mdV2ToggleBankAuto=async function(enabled){
  const {error}=await supa.rpc('admin_set_bank_auto_reconcile',{p_enabled:enabled});
  if(error)return alert(error.message);
  alert(enabled?'✅ Đã bật đối soát tự động.':'Đã tắt đối soát tự động.');
  openBankSettings();
};

window.mdWalletTopupForm=async function(studentId){
  const [{data:st,error:se},{data:bal,error:be},{data:claims,error:ce},{data:bankRows,error:bankErr}]=await Promise.all([
    supa.from('students').select('id,full_name').eq('id',studentId).maybeSingle(),
    supa.rpc('student_credit_balance',{p_student_id:studentId}),
    supa.rpc('student_list_credit_claims',{p_student_id:studentId}),
    supa.rpc('student_bank_transfer_info')
  ]);
  if(se||be||ce||bankErr)return alert((se||be||ce||bankErr).message);
  const bank=Array.isArray(bankRows)?bankRows[0]:bankRows;
  const configured=v111BankConfigured(bank||{});
  window._mdTopupBank=bank||null;

  $('content').innerHTML=`<div class="card">
    <div class="row"><div><h2>💰 Nạp số dư MinDance</h2><div class="muted">${esc(st?.full_name||'Học viên')}</div></div><button class="btn" onclick="mdCreditHub('${studentId}')">Quay lại</button></div>
    <div class="notice ok" style="margin-top:10px"><b>Số dư hiện tại: ${mdMoney(bal||0)}</b><div class="small">Chuyển vào tài khoản trung tâm. Nếu đối soát tự động đã kết nối, tiền sẽ vào ví khi giao dịch khớp mã NAP.</div></div>
  </div>

  <div class="card">
    <h2>🏦 Tạo QR nạp ví</h2>
    ${configured?`<div class="small muted">${esc(bank.bank_code)} · ${esc(bank.bank_account_no)} · ${esc(bank.bank_account_name)}</div>`:'<div class="notice warn">Admin chưa cấu hình tài khoản ngân hàng.</div>'}
    <label>Số tiền muốn nạp</label>
    <input id="mdV2TopupAmount" type="number" min="1000" step="1000" inputmode="numeric" placeholder="Ví dụ: 500000">
    <label>Ghi chú</label>
    <input id="mdV2TopupNote" maxlength="200" placeholder="Không bắt buộc">
    <button class="btn primary full" style="margin-top:10px" ${configured?'':'disabled'} onclick="mdV2CreateTopupOrder('${studentId}')">Tạo QR chuyển khoản</button>
    <div id="mdV2TopupQr"></div>
    <div class="small muted" style="margin-top:8px;text-align:center">Tiền mặt: đưa trực tiếp cho trung tâm; Admin tự cộng số dư.</div>
  </div>

  <div class="card">
    <h2>Yêu cầu gần đây</h2>
    ${(claims||[]).slice(0,8).map(x=>`<div class="item"><div class="row"><div><b>${mdMoney(x.amount)}</b><div class="small muted">${new Date(x.requested_at).toLocaleString('vi-VN')}</div></div><span class="badge ${x.status==='approved'?'ok':x.status==='rejected'?'danger':'warn'}">${mdCreditStatus(x.status)}</span></div></div>`).join('')||'<div class="muted">Chưa có yêu cầu nạp.</div>'}
  </div>`;
};

window.mdV2CreateTopupOrder=async function(studentId){
  const amount=Number($('mdV2TopupAmount')?.value||0);
  const note=$('mdV2TopupNote')?.value?.trim()||null;
  if(amount<=0)return alert('Vui lòng nhập số tiền.');

  const {data,error}=await supa.rpc('student_create_credit_topup_order',{p_student_id:studentId,p_amount:amount,p_note:note});
  if(error)return alert(error.message);
  const bank=window._mdTopupBank;
  const code=data?.transfer_code;
  const qr=v111QrUrl(bank,amount,code);

  $('mdV2TopupQr').innerHTML=`<div style="text-align:center;margin-top:14px">
    <img src="${qr}" alt="QR nạp ví" style="width:250px;max-width:82%;border-radius:14px;border:1px solid var(--line)">
    <div class="item" style="text-align:left;margin-top:10px">
      <div class="small muted">Số tiền</div><b>${mdMoney(amount)}</b>
      <div class="small muted" style="margin-top:7px">Nội dung bắt buộc</div><b style="letter-spacing:1px">${esc(code)}</b>
    </div>
    <div class="notice" style="margin-top:10px">Sau khi chuyển khoản, giữ nguyên mã trên. Nếu đối soát tự động chưa kết nối, Admin vẫn có thể duyệt yêu cầu này thủ công.</div>
  </div>`;
};

// 7. HOME INTEGRATION: compact, no duplicate menu explosion
// ---------------------------------------------------------
const mdV2HomeBase=window.openHome;
window.openHome=async function(){
  await mdV2HomeBase();
  const root=$('content'); if(!root)return;

  if(profile?.role==='admin' && !root.querySelector('[data-md-v2-ops]')){
    try{
      const {data,error}=await supa.rpc('admin_ops_dashboard',{p_month:mdMonthDate(mdMonthValue())});
      if(!error){
        const d=data||{};
        const card=document.createElement('div');
        card.className='card';card.setAttribute('data-md-v2-ops','1');
        card.innerHTML=`<div class="row">
          <div><h2>📊 Vận hành</h2><div class="muted">${d.active_students||0} học viên · ${d.new_students||0} mới · đi học ${d.attendance_rate||0}%</div></div>
          <button class="btn primary" onclick="mdV2AdminOperations()">Mở</button>
        </div>
        <div class="grid" style="margin-top:10px">
          <div class="item"><div class="small muted">Doanh thu tháng</div><b>${mdMoney(d.revenue||0)}</b></div>
          <div class="item"><div class="small muted">Công nợ</div><b>${mdMoney(d.outstanding||0)}</b></div>
        </div>`;
        root.appendChild(card);
      }
    }catch(_){}
  }

  if(profile?.role==='student' && !root.querySelector('[data-md-v2-renew]')){
    try{
      const {student}=await mdFocusedStudent();
      if(student){
        const {data,error}=await supa.rpc('student_renewal_suggestions',{p_student_id:student.id});
        if(!error && (data||[]).length){
          const card=document.createElement('div');
          card.className='card';card.setAttribute('data-md-v2-renew','1');
          card.innerHTML=`<div class="row">
            <div><h2>🔄 Sắp cần gia hạn</h2><div class="muted">${data.length} gói gần hết buổi hoặc gần hết hạn</div></div>
            <button class="btn primary" onclick="mdV2RenewalHub()">Xem</button>
          </div>`;
          root.appendChild(card);
        }
      }
    }catch(_){}
  }
};

// V2.4 frontend cleanup: Parent login role is retired.
// Guardian/contact fields remain as student profile data, but no Parent account actions are exposed.
function mdV21RemoveLegacyParentUi(){
  document.querySelectorAll('option[value=\"parent\"]').forEach(el=>el.remove());

  // Remove any legacy Parent-account action that an older render layer may inject.
  document.querySelectorAll('[onclick*=\"showLinkParent\"],[onclick*=\"linkParent\"],[onclick*=\"unlinkParent\"]').forEach(el=>el.remove());

  // Remove the obsolete Parent-account linking card. Guardian name/phone remain in the student profile header.
  document.querySelectorAll('#content .card').forEach(card=>{
    const txt=(card.textContent||'').trim();
    if(txt.includes('Phụ huynh liên kết') || txt.includes('tài khoản phụ huynh')) card.remove();
  });

  // Remove legacy wording from old render layers if one flashes before the final role UI is applied.
  document.querySelectorAll('.center .muted').forEach(el=>{
    if((el.textContent||'').includes('Phụ huynh')) el.textContent=(el.textContent||'').replace(/\s*·\s*Phụ huynh/g,'');
  });
}

// Hard-disable retired Parent account actions. Backend RPCs are already revoked as defense in depth.
window.autoLinkParentByPhone=async function(){};
window.showLinkParent=async function(){};
window.linkParent=async function(){};
window.unlinkParent=async function(){};

window.addEventListener('load',mdV21RemoveLegacyParentUi);
new MutationObserver(mdV21RemoveLegacyParentUi).observe(document.documentElement,{childList:true,subtree:true});

document.title='MinDance';
window.MINDANCE_RELEASE='V2_4_GITHUB_PAGES_CLEAN';
window.MINDANCE_BUILD='2026-09-06';
</script>
