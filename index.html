<script>
// ===== V12.5 · SELF REGISTRATION + TRIAL + TUITION CREDIT + STUDENT QR =====
const V125_VERSION='12.5.0';

function v125IsLearner(){return profile && ['student'].includes(profile.role)}

// ---- Fix V12.4 account UI leftovers --------------------------------------
const v125AccountsBase=v121OpenAccounts;
v121OpenAccounts=async function(){
  await v125AccountsBase();
  if(!admin())return;
  document.querySelectorAll('.kpi').forEach(k=>{if((k.textContent||'').includes('Phụ huynh'))k.remove()});
  document.querySelectorAll('button.btn').forEach(b=>{if((b.textContent||'').trim()==='Liên kết')b.textContent='Gắn học viên'});
};

v124ShowAttachStudent=async function(uid){
  if(!admin())return;
  const [{data:students,error},{data:direct},{data:linked}]=await Promise.all([
    supa.from('students').select('id,full_name,student_type,active,user_id').eq('active',true).order('full_name'),
    supa.from('students').select('id').eq('user_id',uid),
    supa.from('guardian_students').select('student_id').eq('guardian_user_id',uid)
  ]);
  if(error)return alert(error.message);
  const attached=new Set([...(direct||[]).map(x=>x.id),...(linked||[]).map(x=>x.student_id)]);
  const available=(students||[]).filter(s=>!attached.has(s.id));
  $('content').innerHTML=`<div class="card"><div class="row"><div><h2>Gắn học viên</h2><div class="muted">Một tài khoản có thể quản lý nhiều hồ sơ.</div></div><button class="btn" onclick="openAccounts()">Quay lại</button></div>
  ${available.map(s=>`<div class="item"><div class="row"><div><b>${esc(s.full_name)}</b><div class="muted">${s.student_type==='child'?'Đăng ký hộ':'Học viên'}</div></div><button class="btn primary" onclick="v124AttachStudent('${uid}','${s.id}')">Gắn</button></div></div>`).join('')||'<div class="notice ok" style="margin-top:10px">Tất cả hồ sơ phù hợp đã được gắn.</div>'}</div>`;
};

// ---- Learner class hub ----------------------------------------------------
async function v125MyEnrollmentRows(){
  const ss=await v124ManagedStudents(); if(!ss.length)return [];
  const ids=ss.map(s=>s.id);
  const {data}=await supa.from('enrollments').select('id,student_id,class_id,active,is_trial,trial_session_id,start_date,end_date,classes(id,name,level)').in('student_id',ids).order('created_at',{ascending:false});
  return data||[];
}

async function v125ClassesHub(tab='mine'){
  if(!v125IsLearner())return openClassesAdmin();
  if(tab==='discover')return v125DiscoverClasses();
  const ss=await v124ManagedStudents(); const names=Object.fromEntries(ss.map(s=>[s.id,s.full_name]));
  const rows=(await v125MyEnrollmentRows()).filter(x=>x.active);
  $('content').innerHTML=`<div class="card"><div class="tabs"><button class="tab active" onclick="v125ClassesHub('mine')">Lớp của tôi</button><button class="tab" onclick="v125ClassesHub('discover')">Khám phá lớp</button></div>
  ${rows.map(x=>`<div class="item"><div class="row"><div><b>${esc(x.classes?.name||'')}</b><div class="muted">${esc(names[x.student_id]||'')} · ${esc(x.classes?.level||'')}${x.is_trial?' · Học thử':''}</div></div><span class="badge ${x.is_trial?'warn':'ok'}">${x.is_trial?'Học thử':'Đang học'}</span></div></div>`).join('')||'<div class="muted" style="margin-top:12px">Chưa có lớp đang học.</div>'}</div>`;
}

async function v125DiscoverClasses(){
  const [{data:classes,error},{data:schedules},{data:enrollments}]=await Promise.all([
    supa.from('classes').select('id,name,level,capacity,min_age,max_age,self_registration_enabled,trial_enabled').eq('active',true).eq('self_registration_enabled',true).order('name'),
    supa.from('class_schedules').select('class_id,weekday,start_time,end_time,rooms(name)').eq('active',true).order('weekday').order('start_time'),
    supa.from('enrollments').select('class_id').eq('active',true)
  ]);
  if(error)return alert('Cần chạy SQL V12.5 trước: '+error.message);
  const cnt={};(enrollments||[]).forEach(x=>cnt[x.class_id]=(cnt[x.class_id]||0)+1);
  const sch={};(schedules||[]).forEach(x=>(sch[x.class_id]??=[]).push(x));
  const day=d=>({1:'T2',2:'T3',3:'T4',4:'T5',5:'T6',6:'T7',7:'CN'})[d]||d;
  $('content').innerHTML=`<div class="card"><div class="tabs"><button class="tab" onclick="v125ClassesHub('mine')">Lớp của tôi</button><button class="tab active" onclick="v125ClassesHub('discover')">Khám phá lớp</button></div>
  <div class="muted" style="margin:10px 0">Các lớp đang hoạt động và nhận đăng ký trực tuyến.</div>
  ${(classes||[]).map(c=>{const used=cnt[c.id]||0,left=c.capacity?Math.max(0,c.capacity-used):null;return `<div class="item"><div class="row"><div><b>${esc(c.name)}</b><div class="muted">${esc(c.level||'')} ${c.min_age!=null||c.max_age!=null?'· tuổi '+(c.min_age??0)+'–'+(c.max_age??'∞'):''}</div></div><span class="badge ${left===0?'danger':'ok'}">${left==null?'Còn nhận':left+' chỗ'}</span></div><div class="small" style="margin-top:7px">${(sch[c.id]||[]).map(x=>`${day(x.weekday)} ${(x.start_time||'').slice(0,5)}–${(x.end_time||'').slice(0,5)}${x.rooms?.name?' · '+esc(x.rooms.name):''}`).join('<br>')||'Chưa xếp lịch cố định'}</div><button class="btn primary full" style="margin-top:9px" ${left===0?'disabled':''} onclick="v125OpenClass('${c.id}')">Xem & đăng ký</button></div>`}).join('')||'<div class="muted">Hiện chưa có lớp nhận đăng ký trực tuyến.</div>'}</div>`;
}

async function v125OpenClass(classId){
  const ss=await v124ManagedStudents();
  const [{data:c,error},{data:packs},{data:sessions}]=await Promise.all([
    supa.from('classes').select('id,name,level,capacity,min_age,max_age,trial_enabled,self_registration_enabled').eq('id',classId).single(),
    supa.from('packages').select('id,name,package_type,price,duration_months,total_uses,sessions_per_month').eq('active',true).order('price'),
    supa.from('class_sessions').select('id,session_date,start_time,end_time,status,rooms(name)').eq('class_id',classId).eq('status','planned').gte('session_date',v104Today()).order('session_date').order('start_time').limit(8)
  ]);
  if(error)return alert(error.message);
  window._v125Class={c,ss,packs:packs||[],sessions:sessions||[]};
  $('content').innerHTML=`<div class="card"><div class="row"><div><h2>${esc(c.name)}</h2><div class="muted">${esc(c.level||'')}</div></div><button class="btn" onclick="v125DiscoverClasses()">Quay lại</button></div>
  ${c.trial_enabled?`<div class="notice ok" style="margin-top:10px"><b>🎁 Học thử miễn phí 1 buổi</b><div class="small">Mỗi hồ sơ học viên được sử dụng 1 lần.</div></div><button class="btn full" style="margin-top:8px" onclick="v125TrialForm('${classId}')">Đăng ký học thử</button>`:''}
  <h3 style="margin-top:16px">Đăng ký gói học</h3>${(packs||[]).map(p=>`<div class="item"><div class="row"><div><b>${esc(p.name)}</b><div class="muted">${esc(p.package_type||'')}${p.total_uses?' · '+p.total_uses+' buổi':''}</div></div><b>${money(p.price)}</b></div><button class="btn primary full" style="margin-top:8px" onclick="v125PackageForm('${classId}','${p.id}')">Chọn gói</button></div>`).join('')||'<div class="muted">Chưa có gói học đang hoạt động.</div>'}</div>`;
}

function v125StudentOptions(){return (window._v125Class?.ss||[]).map(s=>`<option value="${s.id}">${esc(s.full_name)}</option>`).join('')}

function v125TrialForm(classId){
  const d=window._v125Class||{}, sessions=d.sessions||[];
  if(!sessions.length)return alert('Lớp chưa có buổi học sắp tới để đăng ký học thử.');
  $('content').innerHTML=`<div class="card"><div class="row"><h2>Đăng ký học thử</h2><button class="btn" onclick="v125OpenClass('${classId}')">Quay lại</button></div><label>Học viên</label><select id="v125Student">${v125StudentOptions()}</select><label>Buổi học thử</label><select id="v125Session">${sessions.map(x=>`<option value="${x.id}">${v12DateVN(x.session_date)} · ${(x.start_time||'').slice(0,5)}–${(x.end_time||'').slice(0,5)}${x.rooms?.name?' · '+esc(x.rooms.name):''}</option>`).join('')}</select><div class="notice ok" style="margin-top:10px">Buổi học thử miễn phí, không phát sinh công nợ và không trừ gói.</div><button class="btn primary full" style="margin-top:10px" onclick="v125SubmitTrial('${classId}')">Xác nhận học thử</button></div>`;
}
async function v125SubmitTrial(classId){
  const sid=$('v125Student')?.value, sessionId=$('v125Session')?.value;if(!sid||!sessionId)return;
  const {data,error}=await supa.rpc('student_start_trial',{p_student_id:sid,p_class_id:classId,p_session_id:sessionId});
  if(error)return alert(error.message);
  alert('✅ Đã đăng ký 1 buổi học thử miễn phí.');openSchedule();
}

function v125PackageForm(classId,packageId){
  const p=(window._v125Class?.packs||[]).find(x=>x.id===packageId);if(!p)return;
  $('content').innerHTML=`<div class="card"><div class="row"><h2>Xác nhận đăng ký</h2><button class="btn" onclick="v125OpenClass('${classId}')">Quay lại</button></div><label>Học viên</label><select id="v125Student">${v125StudentOptions()}</select><div class="item" style="margin-top:10px"><b>${esc(p.name)}</b><div class="muted">${esc(p.package_type||'')}${p.total_uses?' · '+p.total_uses+' buổi':''}</div><div style="font-size:22px;font-weight:800;margin-top:8px">${money(p.price)}</div></div><div class="notice" style="margin-top:10px"><b>Quy tắc học phí</b><div class="small">Học viên mới: phải thanh toán đủ gói đầu tiên trước khi vào học. Học viên cũ: có thể đăng ký trước, nợ học phí và thanh toán sau.</div></div><button class="btn primary full" style="margin-top:10px" onclick="v125SubmitPackage('${classId}','${packageId}')">Đăng ký gói</button></div>`;
}
async function v125SubmitPackage(classId,packageId){
  const sid=$('v125Student')?.value;if(!sid)return;
  const p=(window._v125Class?.packs||[]).find(x=>x.id===packageId);
  const c=window._v125Class?.c;
  const {data,error}=await supa.rpc('student_register_package',{p_student_id:sid,p_class_id:classId,p_package_id:packageId});
  if(error)return alert(error.message);
  const r=Array.isArray(data)?data[0]:data;
  if(!r?.purchase_id)return alert('Đã tạo đăng ký nhưng không nhận được mã hóa đơn.');
  v1262RegistrationChoice({purchaseId:r.purchase_id,studentId:sid,requiresPrepayment:!!r.requires_prepayment,packageName:p?.name||'Gói học',className:c?.name||'Lớp học',price:Number(p?.price||0)});
}

function v1262RegistrationChoice(x){
  const payLater=x.requiresPrepayment?'':`<button class="btn full" style="margin-top:8px" onclick="openHome()">🕒 Thanh toán sau</button>`;
  $('content').innerHTML=`<div class="card"><h2>✅ Đăng ký thành công</h2><div class="item" style="margin-top:10px"><b>${esc(x.packageName)}</b><div class="muted">Lớp: ${esc(x.className)}</div><div style="font-size:22px;font-weight:800;margin-top:8px">${money(x.price)}</div></div>${x.requiresPrepayment?'<div class="notice warn" style="margin-top:10px"><b>Gói đầu tiên cần thanh toán đủ trước khi vào học.</b></div>':'<div class="notice ok" style="margin-top:10px">Bạn có thể thanh toán ngay hoặc để thanh toán sau.</div>'}<button class="btn primary full" style="margin-top:10px" onclick="v125StudentPaymentQR('${x.purchaseId}','${x.studentId}',${x.requiresPrepayment?'true':'false'})">💳 Thanh toán ngay</button>${payLater}<button class="btn full" style="margin-top:8px;color:#b42318" onclick="v1262CancelPurchase('${x.purchaseId}')">Hủy đăng ký</button><div class="small muted" style="margin-top:10px">Tự hủy trong 12 giờ khi chưa thanh toán và chưa sử dụng buổi học. Nếu đã thanh toán, MinDance sẽ giữ lịch sử giao dịch và cần Admin xử lý hoàn tiền an toàn.</div></div>`;
}

async function v1262CancelPurchase(pid){
  const {data:check,error:ce}=await supa.rpc('student_can_cancel_purchase',{p_purchase_id:pid});
  if(ce)return alert(ce.message);
  if(!check?.can_cancel)return alert(check?.reason||'Không thể hủy đăng ký này.');
  if(!confirm('Hủy đăng ký này? Hóa đơn sẽ được lưu lịch sử ở trạng thái đã hủy.'))return;
  const {data,error}=await supa.rpc('student_cancel_purchase',{p_purchase_id:pid});
  if(error)return alert(error.message);
  alert(data?.message||'✅ Đã hủy đăng ký.');
  openHome();
}

async function v125StudentPaymentQR(pid,studentId=null,prepay=false){
  if(!v125IsLearner())return openPaymentQR(pid,studentId);
  const [{data:s,error:se},{data:o,error:oe}]=await Promise.all([
    supa.from('center_settings').select('bank_code,bank_account_no,bank_account_name,payment_prefix,auto_bank_enabled').eq('id',1).single(),
    supa.rpc('student_create_payment_order',{p_purchase_id:pid})
  ]);
  if(se)return alert(se.message); if(oe)return alert(oe.message);
  const order=Array.isArray(o)?o[0]:o;
  if(!v111BankConfigured(s))return $('content').innerHTML='<div class="card"><h2>Chưa thể thanh toán QR</h2><div class="notice warn">Trung tâm chưa cấu hình tài khoản ngân hàng. Vui lòng liên hệ trung tâm.</div><button class="btn full" style="margin-top:10px" onclick="openHome()">Quay lại</button></div>';
  const qr=v111QrUrl(s,order.expected_amount,order.payment_code);
  $('content').innerHTML=`<div class="card"><div class="row"><div><h2>${prepay?'Thanh toán để kích hoạt lớp':'Thanh toán học phí'}</h2><div class="muted">Quét QR và giữ nguyên nội dung chuyển khoản</div></div><button class="btn" onclick="openHome()">Quay lại</button></div><div class="center" style="margin-top:12px"><img src="${qr}" alt="VietQR" style="width:100%;max-width:330px;border-radius:14px;border:1px solid var(--line)"></div><div class="item"><div class="small muted">Số tiền</div><b style="font-size:22px">${money(order.expected_amount)}</b><div class="small muted" style="margin-top:8px">Nội dung chuyển khoản</div><b style="font-size:19px;letter-spacing:1px">${esc(order.payment_code)}</b></div><div class="notice ${s.auto_bank_enabled?'ok':''}" style="margin-top:10px">${s.auto_bank_enabled?'⚡ Hệ thống sẽ tự ghi nhận khi giao dịch được đối soát.':'Sau khi chuyển khoản, trung tâm có thể xác nhận thủ công nếu đối soát tự động chưa bật.'}</div><button class="btn primary full" style="margin-top:10px" onclick="v125RefreshStudentOrder('${order.id}')">🔄 Kiểm tra thanh toán</button></div>`;
}
async function v125RefreshStudentOrder(orderId){
  const {data:o,error}=await supa.from('payment_orders').select('status,paid_amount,expected_amount').eq('id',orderId).single();if(error)return alert(error.message);
  if(o.status==='paid'){alert('✅ Đã nhận đủ học phí.');return openHome()}
  alert(o.status==='partial'?'Đã nhận một phần: '+money(o.paid_amount||0):'Chưa thấy giao dịch khớp.');
}

// Student payment screens use learner QR instead of the admin-only QR function.
const v125StudentPaymentsBase=v12OpenStudentPayments;
v12OpenStudentPayments=async function(studentId){
  if(!v125IsLearner())return v125StudentPaymentsBase(studentId);
  const {data:s}=await supa.from('students').select('full_name').eq('id',studentId).single();
  const {data:packs,error}=await supa.from('package_purchases').select('id,package_name_snapshot,price_snapshot,status,end_date,requires_prepayment,payments(amount,paid_at,method)').eq('student_id',studentId).order('created_at',{ascending:false});if(error)return alert(error.message);
  $('content').innerHTML=`<div class="card"><div class="row"><div><h2>Học phí · ${esc(s?.full_name||'')}</h2><div class="muted">Thanh toán toàn bộ số tiền còn thiếu bằng QR</div></div><button class="btn" onclick="openMore()">Quay lại</button></div>${(packs||[]).map(p=>{const paid=(p.payments||[]).reduce((a,b)=>a+Number(b.amount||0),0),due=Math.max(0,Number(p.price_snapshot||0)-paid);return `<div class="item"><div class="row"><div><b>${esc(p.package_name_snapshot||'')}</b><div class="muted">Đã đóng ${money(paid)} · Còn ${money(due)}</div></div><span class="badge ${due<=0?'ok':'warn'}">${due<=0?'Đã đủ':p.requires_prepayment?'Chờ trả trước':'Còn nợ'}</span></div>${due>0?`<button class="btn primary full" style="margin-top:8px" onclick="v125StudentPaymentQR('${p.id}','${studentId}',${p.requires_prepayment?'true':'false'})">📱 Thanh toán QR</button>`:''}</div>`}).join('')||'<div class="muted">Chưa có gói học.</div>'}</div>`;
};

// ---- Automatic debt reminder card ----------------------------------------
async function v125ReminderHtml(studentIds){
  if(!studentIds.length)return '';
  const {data,error}=await supa.from('tuition_reminders').select('id,student_id,purchase_id,attendance_count,amount_due,threshold_sessions,status').in('student_id',studentIds).eq('status','open').order('created_at',{ascending:false});
  if(error)return '';
  if(!(data||[]).length)return '';
  const ss=await v124ManagedStudents(), names=Object.fromEntries(ss.map(s=>[s.id,s.full_name]));
  return `<div class="card"><h2>🔔 Nhắc học phí</h2>${data.map(r=>`<div class="notice warn" style="margin-top:8px"><b>${esc(names[r.student_id]||'Học viên')} đã học ${r.attendance_count} buổi</b><div class="small">Còn ${money(r.amount_due)} học phí chưa thanh toán.</div><button class="btn primary full" style="margin-top:8px" onclick="v125StudentPaymentQR('${r.purchase_id}','${r.student_id}',false)">Thanh toán QR</button></div>`).join('')}</div>`;

const v125HomeBase=openHome;
openHome=async function(){
  await v125HomeBase();
  if(!v125IsLearner())return;
  const ss=await v124ManagedStudents(); const html=await v125ReminderHtml(ss.map(s=>s.id));
  if(html && $('content')) $('content').insertAdjacentHTML('afterbegin',html);
};

// ---- Learner schedule: trial only shows the booked session ----------------
openSchedule=async function(){
  if(!active())return;
  if(!v125IsLearner()){
    if(['admin','teacher'].includes(profile.role)) await v104GenerateSessions(null,true);
    const from=v104AddDays(v104Today(),-14),to=v104AddDays(v104Today(),45);let q=supa.from('class_sessions').select('id,class_id,session_date,start_time,end_time,status,classes(name),rooms(name)').gte('session_date',from).lte('session_date',to).order('session_date').order('start_time');
    if(profile.role==='teacher'){const {data:cs}=await supa.from('classes').select('id').eq('teacher_user_id',profile.id).eq('active',true);const ids=(cs||[]).map(x=>x.id);if(!ids.length){$('content').innerHTML='<div class="card"><h2>Lịch dạy</h2><div class="muted">Chưa có lớp.</div></div>';return}q=q.in('class_id',ids)}
    const {data,error}=await q;if(error)return alert(error.message);const canAttend=['admin','teacher'].includes(profile.role);$('content').innerHTML=`<div class="card"><h2>${profile.role==='teacher'?'Lịch dạy':'Lịch học'}</h2>${(data||[]).map(x=>`<div class="item"><div class="row"><div><b>${esc(x.classes?.name||'')}</b><div class="muted">${v12DateVN(x.session_date)} · ${(x.start_time||'').slice(0,5)}–${(x.end_time||'').slice(0,5)}${x.rooms?.name?' · '+esc(x.rooms.name):''}</div></div>${canAttend&&x.status!=='cancelled'?`<button class="btn primary" onclick="openClassAttendance('${x.class_id}','${x.session_date}','${x.id}')">Điểm danh</button>`:''}</div></div>`).join('')||'<div class="muted">Chưa có lịch.</div>'}</div>`;return;
  }
  const ss=await v124ManagedStudents(); if(!ss.length)return;
  const ids=ss.map(s=>s.id), names=Object.fromEntries(ss.map(s=>[s.id,s.full_name]));
  const {data:enrs}=await supa.from('enrollments').select('id,student_id,class_id,is_trial,trial_session_id,active').in('student_id',ids).eq('active',true);
  const normal=(enrs||[]).filter(e=>!e.is_trial), trial=(enrs||[]).filter(e=>e.is_trial&&e.trial_session_id);
  let sessions=[];
  const classIds=[...new Set(normal.map(e=>e.class_id))];
  if(classIds.length){const {data}=await supa.from('class_sessions').select('id,class_id,session_date,start_time,end_time,status,classes(name),rooms(name)').in('class_id',classIds).gte('session_date',v104Today()).neq('status','cancelled').order('session_date').order('start_time').limit(80);sessions.push(...(data||[]).map(x=>({...x,_trial:false})))}
  const trialIds=trial.map(e=>e.trial_session_id);if(trialIds.length){const {data}=await supa.from('class_sessions').select('id,class_id,session_date,start_time,end_time,status,classes(name),rooms(name)').in('id',trialIds).neq('status','cancelled');sessions.push(...(data||[]).map(x=>({...x,_trial:true})))}
  const seen=new Set();sessions=sessions.filter(x=>!seen.has(x.id)&&seen.add(x.id)).sort((a,b)=>(a.session_date+a.start_time).localeCompare(b.session_date+b.start_time));
  $('content').innerHTML=`<div class="card"><h2>Lịch học</h2>${sessions.map(x=>`<div class="item"><div class="row"><div><b>${esc(x.classes?.name||'')}</b><div class="muted">${v12DateVN(x.session_date)} · ${(x.start_time||'').slice(0,5)}–${(x.end_time||'').slice(0,5)}${x.rooms?.name?' · '+esc(x.rooms.name):''}</div></div>${x._trial?'<span class="badge warn">Học thử</span>':''}</div></div>`).join('')||'<div class="muted">Chưa có lịch.</div>'}</div>`;
};

const v125AttendanceBase=openClassAttendance;
openClassAttendance=async function(classId,sessionDate=null,sessionId=null){
  const date=sessionDate||v104Today();
  const [{data:e,error:ee},{data:a,error:ae},{data:c}]=await Promise.all([

  if(ee||ae)return v125AttendanceBase(classId,sessionDate,sessionId);
  const eligible=(e||[]).filter(x=>!x.is_trial || (sessionId && x.trial_session_id===sessionId));
  const statusMap={};(a||[]).forEach(x=>statusMap[x.enrollment_id]=x.status);
  const options=val=>[['','Chưa điểm danh'],['present','Có mặt'],['excused','Nghỉ phép'],['absent','Vắng'],['late','Đi muộn']].map(([v,t])=>`<option value="${v}" ${v===val?'selected':''}>${t}</option>`).join('');

async function v126SelfSignUp(){
  const full_name=($('v126RegName')?.value||'').trim();
  const phone=($('v126RegPhone')?.value||'').trim();
  const email=($('v126RegEmail')?.value||'').trim().toLowerCase();
  const password=$('v126RegPassword')?.value||'';
  const password2=$('v126RegPassword2')?.value||'';
  const btn=$('v126RegBtn'), status=$('v126RegStatus');
  if(!full_name||!phone||!email||!password)return alert('Vui lòng nhập đủ họ tên, số điện thoại, email và mật khẩu.');

  if(password!==password2)return alert('Hai mật khẩu chưa giống nhau.');
  try{
    if(btn){btn.disabled=true;btn.textContent='Đang tạo tài khoản…'}
    if(status)status.textContent='Đang đăng ký với Supabase…';
    const {data,error}=await supa.auth.signUp({
      email,password,
      options:{data:{full_name,phone,requested_role:'student',self_signup:'true'}}
    });
    if(error)throw error;
    if(data?.session){
      if(status)status.textContent='Đăng ký thành công.';

<script>
// ===== V12.8 · UNIFIED PT 1:1 NOTIFICATION FLOW =====
const V128='12.8';
let v128LastCount=null;
let v128RefreshBusy=false;
let v128HomeRenderSeq=0;

function v128Role(){ return profile?.role||''; }
function v128IsMain(){ return !!document.getElementById('main')?.classList.contains('active'); }
function v128NoticeKey(){ return `dc_v128_notice_${profile?.id||'anon'}_${v128Role()}`; }
function v128Label(b){
  if(b.status==='teacher_declined') return '⚠️ PT đã từ chối';
  if(b.status==='center_proposed') return '🔄 Có phương án thay thế';
  if(b.status==='refund_pending') return '💸 Chờ xử lý hoàn tiền';
  if(b.status==='confirmed') return '✅ PT đã nhận lớp';
  if(b.status==='student_accepted') return '✅ Học viên đã đồng ý phương án';
  return '🆕 Booking PT mới';
}
function v128StatusNeedsAdmin(s){return ['pending_teacher','teacher_declined','center_proposed','refund_pending'].includes(s)}

async function v128ManagedStudentIds(){
  try { const ss=await v127ManagedStudents(); return (ss||[]).map(x=>x.id).filter(Boolean); }
  catch(_){ return []; }
}

async function v128Rows(){
  if(!profile) return [];
  const role=v128Role();
  let q=supa.from('one_to_one_bookings')
    .select('id,student_id,class_id,teacher_user_id,lesson_date,start_time,end_time,status,created_at,note,teacher_decline_reason,students(full_name),classes(name)')
    .order('created_at',{ascending:false}).limit(80);
  if(role==='admin') q=q.in('status',['pending_teacher','teacher_declined','center_proposed','refund_pending']);
  else if(role==='teacher') q=q.eq('teacher_user_id',profile.id).eq('status','pending_teacher');
  else {
    const ids=await v128ManagedStudentIds();
    if(!ids.length) return [];
    q=q.in('student_id',ids).in('status',['confirmed','teacher_declined','center_proposed']);
  }
  const {data,error}=await q;
  if(error){ console.warn('V12.8 1:1 notification query:',error); return []; }
  return data||[];
}

function v128RowHTML(b,role){
  const person=b.students?.full_name||'Học viên';
  const cls=b.classes?.name||'PT 1:1';
  const when=`${v12DateVN(b.lesson_date)} · ${v127Time(b.start_time)}–${v127Time(b.end_time)}`;
  let actions=`<button class="btn primary full" onclick="v127OpenBooking('${b.id}')">Mở booking</button>`;
  if(role==='teacher' && b.status==='pending_teacher') actions=`<div class="grid"><button class="btn primary" onclick="v128TeacherRespond('${b.id}',true)">✓ Nhận lớp</button><button class="btn" onclick="v128TeacherRespond('${b.id}',false)">Từ chối</button></div><button class="btn full" style="margin-top:8px" onclick="v127OpenBooking('${b.id}')">💬 Chi tiết & chat</button>`;
  if(role==='admin' && ['teacher_declined','center_proposed','pending_teacher'].includes(b.status)) actions=`<div class="grid"><button class="btn" onclick="v127OpenBooking('${b.id}')">💬 Chi tiết</button><button class="btn primary" onclick="v127AdminProposal('${b.id}','${b.class_id}')">Điều phối</button></div>`;
  return `<div class="item" data-v128-booking="${b.id}"><div class="row"><div><b>${esc(v128Label(b))}</b><div class="small">${esc(person)} · ${esc(cls)}</div><div class="small muted">${when}</div></div><span class="badge ${v127StatusClass(b.status)}">${esc(v127Status(b.status))}</span></div>${b.teacher_decline_reason?`<div class="notice warn" style="margin-top:7px">Lý do: ${esc(b.teacher_decline_reason)}</div>`:''}<div style="margin-top:8px">${actions}</div></div>`;
}

async function v128NotificationCenter(){
  if(!active()) return;
  const role=v128Role(), rows=await v128Rows();
  const subtitle=role==='admin'?'Các booking PT cần trung tâm theo dõi':role==='teacher'?'Yêu cầu PT đang chờ bạn xác nhận':'Cập nhật booking PT 1:1 của bạn';
  $('content').innerHTML=`<div class="card"><div class="row"><div><h2>🔔 Thông báo PT 1:1</h2><div class="muted">${subtitle}</div></div><button class="btn" onclick="openHome()">Quay lại</button></div></div><div class="card">${rows.map(b=>v128RowHTML(b,role)).join('')||'<div class="muted">Hiện không có thông báo PT 1:1 mới.</div>'}</div>`;
}

async function v128InjectHome(){
  if(!profile) return;
  const seq=++v128HomeRenderSeq;
  const rows=await v128Rows();
  if(seq!==v128HomeRenderSeq) return; // bỏ kết quả cũ nếu có nhiều lần refresh chạy chồng
  const c=$('content'); if(!c || !v128IsMain()) return;
  // Chỉ giữ đúng MỘT khối PT trên Trang chủ, kể cả khi refresh/focus chạy cùng lúc.
  c.querySelectorAll('[data-v128-notice]').forEach(x=>x.remove());
  if(!rows.length) return;
  const role=v128Role();
  const title=role==='admin'?'🔔 PT 1:1 cần theo dõi':role==='teacher'?'🔔 Có học viên đặt PT 1:1':'🔔 Cập nhật PT 1:1';
  const desc=role==='teacher'?`${rows.length} yêu cầu đang chờ bạn Nhận/Từ chối`:role==='admin'?`${rows.length} booking cần trung tâm theo dõi`:`${rows.length} booking có cập nhật mới`;
  const preview=rows[0] ? v128RowHTML(rows[0],role) : '';
  const html=`<div class="card" data-v128-notice style="border:2px solid #ffb020"><div class="row"><div><h2>${title}</h2><div class="muted"><b>${desc}</b></div></div><span class="badge warn">${rows.length}</span></div>${preview}<button class="btn primary full" style="margin-top:10px" onclick="v128NotificationCenter()">Xem tất cả thông báo PT</button></div>`;
  c.insertAdjacentHTML('afterbegin',html);
}

async function v128TeacherRespond(id,accept){
  let reason=null;
  if(!accept){ reason=prompt('Lý do từ chối:'); if(reason===null)return; reason=reason.trim(); if(!reason)return alert('Vui lòng nhập lý do.'); }
  const {error}=await supa.rpc('teacher_respond_one_to_one',{p_booking_id:id,p_accept:accept,p_reason:reason});
  if(error) return alert(error.message||'Không thể xử lý yêu cầu.');
  alert(accept?'✅ Đã nhận lớp PT 1:1.':'Đã từ chối. Trung tâm sẽ nhận thông báo để điều phối.');
  await v128NotificationCenter();
}

// One notification center for every role. Keeps the existing non-PT center reachable through Home/More.
openNotifications=v128NotificationCenter;

const v128HomeBase=openHome;
openHome=async function(){
  await v128HomeBase();
  await v128InjectHome();
};

async function v128Refresh(showToast=true){
  if(v128RefreshBusy || !profile) return;
  v128RefreshBusy=true;
  try{
    const rows=await v128Rows(), count=rows.length;
    const key=v128NoticeKey();
    const prev=Number(localStorage.getItem(key)||0);
    if(showToast && count>prev && prev>=0){
      const delta=count-prev;
      if(delta>0 && v128IsMain()){
        const role=v128Role();
        const msg=role==='teacher'?`🔔 Có ${delta} yêu cầu PT 1:1 mới`:role==='admin'?`🔔 Có ${delta} booking PT mới/cần xử lý`:`🔔 Booking PT 1:1 có cập nhật mới`;
        try{ alert(msg); }catch(_){ }
      }
    }
    localStorage.setItem(key,String(count));
    v128LastCount=count;
    const notice=document.querySelector('[data-v128-notice]');
    if(notice && v128IsMain()) await v128InjectHome();
  }finally{ v128RefreshBusy=false; }
}

// Poll while app is open; also refresh immediately when user returns to the tab/app.
setInterval(()=>{ v128Refresh(true).catch(()=>{}); },20000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) v128Refresh(true).catch(()=>{}); });
window.addEventListener('focus',()=>{ v128Refresh(true).catch(()=>{}); });

// Initial sync after login/boot settles.
setTimeout(()=>{ v128Refresh(false).catch(()=>{}); },1800);

document.title='MinDance V12.8.1';
window.addEventListener('load',()=>{
  document.querySelectorAll('.center .muted').forEach(el=>{
    if(/V12(\.\d+)+/.test(el.textContent||'')) el.textContent='V12.8.1 · PT 1:1 gọn thông báo';
  });
});
</script>

function v129Role(){return profile?.role||''}
function v129IsLearner(){return !!profile && ['student'].includes(profile.role)}
function v129Unique(a){return [...new Set((a||[]).filter(Boolean))]}
async function v129Map(table, ids, cols='id,full_name'){
  ids=v129Unique(ids); if(!ids.length) return {};
  const {data,error}=await supa.from(table).select(cols).in('id',ids);
  if(error){console.warn('v129Map',table,error);return {}}
  return Object.fromEntries((data||[]).map(x=>[x.id,x]));
}
async function v129DecorateBookings(rows){
  rows=rows||[];
  const [sm,cm,tm]=await Promise.all([
    v129Map('students',rows.map(x=>x.student_id)),
    v129Map('classes',rows.map(x=>x.class_id),'id,name'),
    v129Map('profiles',rows.map(x=>x.teacher_user_id),'id,full_name')
  ]);
  return rows.map(b=>({...b,students:sm[b.student_id]||null,classes:cm[b.class_id]||null,profiles:tm[b.teacher_user_id]||null}));
}
async function v129Bookings(mode='all'){
  let q=supa.from('one_to_one_bookings').select('id,student_id,class_id,teacher_user_id,room_id,purchase_id,lesson_date,start_time,end_time,status,note,teacher_decline_reason,created_at,updated_at').order('created_at',{ascending:false}).limit(120);
  if(mode==='teacher') q=q.eq('teacher_user_id',profile.id);
  if(mode==='learner'){
    const ss=await v127ManagedStudents(), ids=ss.map(x=>x.id); if(!ids.length)return [];
    q=q.in('student_id',ids);
  }
  const {data,error}=await q; if(error) throw error;
  return v129DecorateBookings(data||[]);
}
async function v129Offers(){
  const {data,error}=await supa.from('one_to_one_offerings').select('id,class_id,teacher_user_id,default_duration_minutes,min_duration_minutes,max_duration_minutes,booking_notice_hours,active,created_at').eq('active',true).order('created_at');
  if(error) throw error;
  const [cm,tm]=await Promise.all([v129Map('classes',(data||[]).map(x=>x.class_id),'id,name'),v129Map('profiles',(data||[]).map(x=>x.teacher_user_id),'id,full_name')]);
  return (data||[]).map(o=>({...o,classes:cm[o.class_id]||null,profiles:tm[o.teacher_user_id]||null}));
}

  else nav.innerHTML=`<button class="nav" onclick="openHome()"><span>🏠</span>Trang chủ</button><button class="nav" onclick="openStudents()"><span>🪪</span>Hồ sơ</button><button class="nav" onclick="openSchedule()"><span>🗓️</span>Lịch học</button><button class="nav" onclick="v127Hub()"><span>🤝</span>Học 1:1</button><button class="nav" onclick="openMore()"><span>⋯</span>Khác</button>`;

v127OpenBooking=async function(id){
  try{
    const [{data:b0,error:be},{data:msgs0,error:me},{data:props0,error:pe}]=await Promise.all([
      supa.from('one_to_one_bookings').select('id,student_id,class_id,teacher_user_id,purchase_id,lesson_date,start_time,end_time,status,note,teacher_decline_reason').eq('id',id).single(),
      supa.from('one_to_one_messages').select('id,sender_user_id,message,message_type,created_at').eq('booking_id',id).order('created_at'),
      supa.from('one_to_one_proposals').select('id,proposed_teacher_user_id,proposed_date,proposed_start_time,proposed_end_time,status,message,created_at').eq('booking_id',id).order('created_at',{ascending:false})
    ]);

<script>
// ===== MINDANCE V13.1 · CREDIT WALLET UI =====
function mdMoney(n){return new Intl.NumberFormat('vi-VN').format(Number(n||0))+' đ';}

async function mdCreditHub(studentId=null){
  if(!active())return;
  try{
    let ss=[];
    if(profile.role==='admin'){
      if(studentId){const {data}=await supa.from('students').select('id,full_name').eq('id',studentId).maybeSingle();if(data)ss=[data];}

    if(!studentId && ss.length>1){$('content').innerHTML=`<div class="card"><div class="row"><h2>💰 Số dư MinDance</h2><button class="btn" onclick="openMore()">Quay lại</button></div>${ss.map(x=>`<div class="item"><div class="row"><b>${esc(x.full_name)}</b><button class="btn" onclick="mdCreditHub('${x.id}')">Xem số dư</button></div></div>`).join('')}</div>`;return;}
    const st=studentId?ss.find(x=>x.id===studentId)||ss[0]:ss[0];
    const [{data:bal,error:be},{data:hist,error:he},{data:claims,error:ce}]=await Promise.all([
      supa.rpc('student_credit_balance',{p_student_id:st.id}),supa.rpc('student_credit_history',{p_student_id:st.id}),supa.rpc('student_list_credit_claims',{p_student_id:st.id})]);
    if(be||he||ce)throw(be||he||ce);

    const c=(claims||[]).map(x=>`<div class="item"><div class="row"><div><b>${mdMoney(x.amount)}</b><div class="small muted">${esc(x.method||'')} ${x.note?' · '+esc(x.note):''}</div></div><span class="badge ${x.status==='approved'?'ok':x.status==='rejected'?'danger':'warn'}">${mdCreditStatus(x.status)}</span></div></div>`).join('');
    $('content').innerHTML=`<div class="card"><div class="row"><div><h2>💰 Số dư MinDance</h2><div class="muted">${esc(st.full_name)}</div></div><button class="btn" onclick="openMore()">Quay lại</button></div><div style="font-size:30px;font-weight:800;margin-top:14px">${mdMoney(bal||0)}</div><div class="small muted">Sẽ tự động trừ vào học phí/gói học tiếp theo.</div>${profile.role!=='admin'?`<button class="btn primary full" style="margin-top:12px" onclick="mdSubmitCreditClaim('${st.id}')">+ Khai báo khoản đóng dư</button>`:''}</div><div class="card"><h2>Khoản đã khai báo</h2>${c||'<div class="muted">Chưa có khai báo.</div>'}</div><div class="card"><h2>Lịch sử số dư</h2>${h||'<div class="muted">Chưa có giao dịch.</div>'}</div>`;
  }catch(e){alert(e.message||'Không mở được số dư.');}

async function mdSubmitCreditClaim(studentId){
  try{
    const raw=(prompt('Số tiền đã đóng dư (VD: 25000):')||'').replace(/[^0-9]/g,''); if(!raw)return;
    const amount=Number(raw); if(!amount||amount<=0)return alert('Số tiền không hợp lệ.');

    if(!confirm(`Gửi khai báo đóng dư ${mdMoney(amount)}?\nKhoản này chỉ được cộng vào số dư sau khi trung tâm xác nhận.`))return;

  }catch(e){alert(e.message||'Không tải được yêu cầu.');}

const mdBaseOpenMore=window.openMore;

async function mdExpensePickStudent(){

async function mdActivateExpenseWallet(studentId){

async function mdExpenseHub(studentId){
  try{
    const [{data:enabled,error:se},{data:rows,error:re},{data:classes,error:ce}]=await Promise.all([
      supa.rpc('student_teacher_expense_wallet_status',{p_student_id:studentId}),

<script>

const MD_UX_VERSION='1.0';
const mdBaseNotificationRows = v129NotificationRows;

function mdNoticeKey(b){ return `pt1:${b.id}:${b.status}`; }
async function mdReadReceiptKeys(keys){
  keys=[...new Set((keys||[]).filter(Boolean))];
  if(!profile?.id || !keys.length) return new Set();
  const {data,error}=await supa.from('notification_read_receipts').select('entity_key').eq('user_id',profile.id).in('entity_key',keys);
  if(error){ console.warn('read receipts',error); return new Set(); }
  return new Set((data||[]).map(x=>x.entity_key));
}
async function mdMarkReceipt(key){
  if(!profile?.id || !key) return;
  const {error}=await supa.from('notification_read_receipts').upsert({user_id:profile.id,entity_key:key,read_at:new Date().toISOString()},{onConflict:'user_id,entity_key'});
  if(error) console.warn('mark read',error);
}
async function mdMarkReceipts(keys){
  keys=[...new Set((keys||[]).filter(Boolean))];
  if(!profile?.id || !keys.length)return;
  const now=new Date().toISOString();
  const rows=keys.map(entity_key=>({user_id:profile.id,entity_key,read_at:now}));
  const {error}=await supa.from('notification_read_receipts').upsert(rows,{onConflict:'user_id,entity_key'});
  if(error) console.warn('mark all read',error);
}

v129NotificationRows = async function(){
  const rows=await mdBaseNotificationRows();
  const keys=rows.map(mdNoticeKey);
  const read=await mdReadReceiptKeys(keys);
  return rows.filter(b=>!read.has(mdNoticeKey(b))).map(b=>({...b,_md_notice_key:mdNoticeKey(b)}));
};

async function mdSystemUnreadNotifications(){
  if(!profile?.id)return [];
  const {data,error}=await supa.from('notifications').select('id,type,title,message,entity_key,read,created_at').eq('user_id',profile.id).eq('read',false).order('created_at',{ascending:false}).limit(50);
  if(error){ console.warn('notifications',error); return []; }
  return data||[];
}
async function mdUnreadCount(){
  const [pt,sys]=await Promise.all([v129NotificationRows(),mdSystemUnreadNotifications()]);
  return (pt?.length||0)+(sys?.length||0);
}
async function mdMarkSystemRead(id){
  if(!id)return;
  const {error}=await supa.from('notifications').update({read:true}).eq('id',id).eq('user_id',profile.id);
  if(error)return alert(error.message);
  await mdNotificationCenter();
}
async function mdReadAndOpenPT(id,status){
  await mdMarkReceipt(`pt1:${id}:${status}`);
  await v127OpenBooking(id);
}
async function mdMarkAllNotificationsRead(){
  const [pt,sys]=await Promise.all([mdBaseNotificationRows(),mdSystemUnreadNotifications()]);
  await Promise.all([
    mdMarkReceipts((pt||[]).map(mdNoticeKey)),
    sys?.length ? supa.from('notifications').update({read:true}).eq('user_id',profile.id).eq('read',false) : Promise.resolve()
  ]);
  await mdNotificationCenter();
}

function mdPtUnreadRow(b,role){
  let action=`<button class="btn primary full" onclick="mdReadAndOpenPT('${b.id}','${b.status}')">Đọc & mở booking</button>`;
  if(role==='teacher'&&b.status==='pending_teacher') action=`<div class="grid"><button class="btn primary" onclick="v129TeacherRespond('${b.id}',true)">✓ Nhận lớp</button><button class="btn" onclick="v129TeacherRespond('${b.id}',false)">Từ chối</button></div><button class="btn full" style="margin-top:8px" onclick="mdReadAndOpenPT('${b.id}','${b.status}')">Xem chi tiết</button>`;
  if(role==='admin'&&b.status==='teacher_declined') action=`<div class="grid"><button class="btn" onclick="mdReadAndOpenPT('${b.id}','${b.status}')">Đọc & chi tiết</button><button class="btn primary" onclick="v127AdminProposal('${b.id}','${b.class_id}')">Điều phối</button></div>`;
  return `<div class="item"><div class="row"><div><b>${esc(v129NoticeLabel(b))}</b><div class="small">${esc(b.students?.full_name||'Học viên')} · ${esc(b.classes?.name||'PT 1:1')}</div><div class="small muted">${v12DateVN(b.lesson_date)} · ${v127Time(b.start_time)}–${v127Time(b.end_time)}</div></div><span class="badge warn">Mới</span></div><div style="margin-top:8px">${action}</div></div>`;
}

async function mdNotificationCenter(){
  if(!active())return;
  try{
    const role=v129Role();
    const [pt,sys]=await Promise.all([v129NotificationRows(),mdSystemUnreadNotifications()]);
    const total=pt.length+sys.length;
    const sysHtml=sys.map(n=>`<div class="item"><div class="row"><div><b>${esc(n.title||'Thông báo')}</b><div class="small muted">${n.created_at?new Date(n.created_at).toLocaleString('vi-VN'):''}</div></div><span class="badge warn">Mới</span></div><div style="margin-top:6px">${esc(n.message||'')}</div><button class="btn full" style="margin-top:8px" onclick="mdMarkSystemRead('${n.id}')">Đã đọc</button></div>`).join('');
    const ptHtml=pt.map(b=>mdPtUnreadRow(b,role)).join('');
    $('content').innerHTML=`<div class="card"><div class="row"><div><h2>🔔 Thông báo</h2><div class="muted">Chỉ hiển thị thông báo chưa đọc</div></div><button class="btn" onclick="openHome()">Quay lại</button></div>${total?`<button class="btn full" style="margin-top:10px" onclick="mdMarkAllNotificationsRead()">✓ Đánh dấu tất cả đã đọc</button>`:''}</div>${sys.length?`<div class="card"><h2>Hệ thống</h2>${sysHtml}</div>`:''}${pt.length?`<div class="card"><h2>PT 1:1</h2>${ptHtml}</div>`:''}${!total?'<div class="card"><div class="muted">Bạn không có thông báo mới.</div></div>':''}`;
  }catch(e){ alert(e.message||'Không tải được thông báo.'); }
}

function mdStudentFocusKey(){return `mindance_student_focus_${profile?.id||'anon'}`}
async function mdFocusedStudent(){
  const ss=await v124ManagedStudents();
  if(!ss.length)return {students:ss,student:null};
  const saved=localStorage.getItem(mdStudentFocusKey());
  const student=ss.find(s=>s.id===saved)||ss[0];
  if(student?.id) localStorage.setItem(mdStudentFocusKey(),student.id);
  return {students:ss,student};
}
async function mdSetStudentFocus(id){localStorage.setItem(mdStudentFocusKey(),id);await openHome();}

async function mdStudentDashboardData(student){
  const today=new Date().toISOString().slice(0,10);
  const [{data:enrs},{data:packs}]=await Promise.all([
    supa.from('enrollments').select('class_id,classes(name)').eq('student_id',student.id).eq('active',true),
    supa.from('package_purchases').select('id,class_id,package_name_snapshot,price_snapshot,total_uses,remaining_uses,end_date,status,payments(amount)').eq('student_id',student.id).neq('status','cancelled').order('created_at',{ascending:false}).limit(20)
  ]);
  const classIds=[...new Set((enrs||[]).map(x=>x.class_id).filter(Boolean))];
  let next=null;
  if(classIds.length){
    const {data}=await supa.from('class_sessions').select('id,class_id,session_date,start_time,end_time,classes(name),rooms(name)').in('class_id',classIds).gte('session_date',today).neq('status','cancelled').order('session_date').order('start_time').limit(1);
    next=data?.[0]||null;
  }
  let due=0,activePacks=0,remaining=0;
  for(const p of packs||[]){
    const paid=(p.payments||[]).reduce((a,b)=>a+Number(b.amount||0),0);
    due+=Math.max(0,Number(p.price_snapshot||0)-paid);
    if(p.status==='active'){activePacks++; if(p.remaining_uses!=null)remaining+=Number(p.remaining_uses||0);}
  }
  return {next,due,activePacks,remaining};
}

async function mdStudentAbsence(){

}

    $('content').innerHTML=`
      <div class="card" style="padding-bottom:14px"><div class="row"><div><h2 style="margin-bottom:2px">Xin chào 👋</h2><div style="font-size:19px;font-weight:800">${esc(student.full_name)}</div></div>${unread?`<button class="btn" onclick="mdNotificationCenter()">🔔 <b>${unread}</b></button>`:''}</div>${selector}</div>
      ${unread?`<button class="card" onclick="mdNotificationCenter()" style="width:100%;text-align:left;border:1.5px solid #f59e0b"><div class="row"><div><b>🔔 ${unread} thông báo mới</b><div class="small muted">Đọc xong sẽ tự biến mất khỏi Trang chủ</div></div><span>›</span></div></button>`:''}
      <div class="card"><h2>Việc thường dùng</h2><div class="grid" style="gap:10px">${mdQuick('🗓️','Lịch học','Xem từng lớp','openSchedule()')}${mdQuick('💳','Học phí',d.due>0?'Còn '+money(d.due):'Đã thanh toán đủ','v124PaymentsChooser()')}${mdQuick('📝','Báo nghỉ','Gửi nhanh cho lớp','mdStudentAbsence()')}${mdQuick('🤝','PT 1:1','Đặt & theo dõi','v127StudentBookings()')}</div></div>

      <div class="card"><div class="row"><div><h2>Gói & học phí</h2><div class="muted">${d.activePacks} gói đang hoạt động${d.remaining?` · còn ${d.remaining} buổi`:''}</div></div><button class="btn" onclick="openStudents()">Hồ sơ</button></div><div class="grid" style="margin-top:10px"><div class="kpi"><span class="muted">Còn phải đóng</span><b>${money(d.due)}</b></div><div class="kpi"><span class="muted">Gói đang học</span><b>${d.activePacks}</b></div></div></div>`;

<script>

const MD_FLOW_VERSION='2.0';
function mdFlowMonthValue(d=new Date()){return d.toISOString().slice(0,7)}
function mdFlowMonthDate(m){return (m||mdFlowMonthValue())+'-01'}
function mdFlowShiftMonth(m,delta){const d=new Date(mdFlowMonthDate(m)+'T00:00:00');d.setMonth(d.getMonth()+delta);return mdFlowMonthValue(d)}
function mdFlowStatusLabel(s){return ({present:'Có mặt',absent:'Vắng',excused:'Nghỉ phép',leave:'Nghỉ phép',absent_excused:'Nghỉ phép',late:'Đi muộn'})[s]||s||'Chưa điểm danh'}
function mdFlowStatusBadge(s){return s==='present'?'ok':(s==='absent'?'danger':(s==='late'?'warn':''))}
async function mdFlowMarkTypesRead(types){
 if(!profile?.id||!types?.length)return;
 await supa.from('notifications').update({read:true}).eq('user_id',profile.id).eq('read',false).in('type',types);
}
async function mdFlowBadges(){
 const [pt,sys]=await Promise.all([v129NotificationRows(),mdSystemUnreadNotifications()]);
 const count=(fn)=>sys.filter(fn).length;
 return {
  pt:(pt||[]).length,
  launch:count(n=>n.type==='launch_favorite'),

 };
}
function mdFlowTile(icon,title,sub,action,count=0,hot=false){

 return `<button class="item" onclick="${action}" style="width:100%;text-align:left;min-height:108px;padding:15px;border-radius:18px;position:relative;${glow?'border:2px solid #8b5cf6;box-shadow:0 0 0 4px #f3e8ff;':''}"><div style="font-size:27px">${icon}</div><b style="display:block;margin-top:7px;font-size:17px">${title}</b><div class="small muted" style="margin-top:3px">${sub||''}</div>${count?`<span class="badge warn" style="position:absolute;right:12px;top:12px">${count}</span>`:''}</button>`;

async function mdAdminTuitionData(){
 const {data,error}=await supa.from('package_purchases').select(`id,student_id,price_snapshot,package_name_snapshot,status,created_at,students(full_name),enrollments(classes(name)),payments(amount)`).in('status',['active','expired','used_up']).order('created_at',{ascending:false});
 if(error)throw error;
 const debts=(data||[]).map(p=>{const paid=(p.payments||[]).reduce((a,b)=>a+Number(b.amount||0),0),due=Math.max(0,Number(p.price_snapshot||0)-paid);return {...p,paid,due,name:p.students?.full_name||'Học viên',class_name:p.enrollments?.classes?.name||''};}).filter(x=>x.due>0);
 const grouped={};for(const x of debts){const k=x.student_id||'none';if(!grouped[k])grouped[k]={student_id:x.student_id,name:x.name,total:0,items:[]};grouped[k].total+=x.due;grouped[k].items.push(x);}return Object.values(grouped);
}

async function mdRemindTuitionStudent(studentId){

<script>
// ===== MINDANCE ROLE FLOW FIX =====
// Attendance writes belong to teachers only. Admin/student/parent see read-only learning progress.
function mdRoleMonthValue(d=new Date()){return d.toISOString().slice(0,7)}
function mdRoleMonthDate(m){return (m||mdRoleMonthValue())+'-01'}
function mdRoleShiftMonth(m,delta){const d=new Date(mdRoleMonthDate(m)+'T00:00:00');d.setMonth(d.getMonth()+delta);return d.toISOString().slice(0,7)}
function mdRoleMonthEnd(m){const [y,mo]=(m||mdRoleMonthValue()).split('-').map(Number);return new Date(Date.UTC(y,mo,0)).toISOString().slice(0,10)}
function mdRoleMonthLabel(m){return new Date(mdRoleMonthDate(m)+'T00:00:00').toLocaleDateString('vi-VN',{month:'long',year:'numeric'})}
function mdRoleStatusLabel(s){return ({present:'Có mặt',absent:'Vắng',excused:'Nghỉ phép',leave:'Nghỉ phép',absent_excused:'Nghỉ phép',late:'Đi muộn'})[s]||s||'Chưa ghi nhận'}
function mdRoleStatusClass(s){return s==='present'?'ok':s==='absent'?'danger':s==='late'?'warn':''}

};

async function mdStaffMonthSchedule(month=mdRoleMonthValue()){
 if(!['admin','teacher'].includes(profile?.role))return;
 const from=mdRoleMonthDate(month),to=mdRoleMonthEnd(month);
 let classIds=[];
 if(profile.role==='teacher'){
   const {data,error}=await supa.from('classes').select('id').eq('teacher_user_id',profile.id).eq('active',true);if(error)return alert(error.message);classIds=(data||[]).map(x=>x.id);
 }
 let q=supa.from('class_sessions').select('id,class_id,session_date,start_time,end_time,status,classes(name),rooms(name)').gte('session_date',from).lte('session_date',to).order('session_date').order('start_time');
 if(classIds.length)q=q.in('class_id',classIds); else if(profile.role==='teacher') return $('content').innerHTML='<div class="card"><h2>Lịch dạy</h2><div class="muted">Chưa có lớp được phân công.</div></div>';
 const {data,error}=await q;if(error)return alert(error.message);

 $('content').innerHTML=`<div class="card"><div class="row"><div><h2>${profile.role==='teacher'?'🗓️ Lịch dạy':'🗓️ Lịch trung tâm'}</h2><div class="muted">Mỗi lần chỉ hiển thị một tháng</div></div>${profile.role==='admin'?'<button class="btn" onclick="openClassesAdmin()">Quản lý lớp</button>':''}</div><div class="row" style="margin-top:10px"><button class="btn" onclick="mdStaffMonthSchedule('${mdRoleShiftMonth(month,-1)}')">‹ Tháng trước</button><b>${mdRoleMonthLabel(month)}</b><button class="btn" onclick="mdStaffMonthSchedule('${mdRoleShiftMonth(month,1)}')">Tháng sau ›</button></div></div>
 ${Object.values(groups).map(g=>`<div class="card"><div class="row"><h2>${esc(g.name)}</h2><span class="badge">${g.rows.length} buổi</span></div>${g.rows.map(x=>`<div class="item"><div class="row"><div><b>${v12DateVN(x.session_date)} · ${String(x.start_time||'').slice(0,5)}–${String(x.end_time||'').slice(0,5)}</b><div class="small muted">${esc(x.rooms?.name||'Chưa xếp phòng')}</div></div><span class="badge ${x.status==='completed'?'ok':x.status==='cancelled'?'danger':''}">${x.status==='completed'?'Đã học':x.status==='cancelled'?'Đã hủy':'Sắp tới'}</span></div>${profile.role==='teacher'&&x.status!=='cancelled'?`<button class="btn primary full" style="margin-top:8px" onclick="openClassAttendance('${x.class_id}','${x.session_date}','${x.id}')">✅ Điểm danh</button>`:''}</div>`).join('')}</div>`).join('')||'<div class="card"><div class="muted">Không có buổi học trong tháng này.</div></div>'}`;
}

async function mdAdminProgress(month=mdRoleMonthValue()){

   const cid=a.class_id||'none'; const c=classMap[cid]??={name:a.classes?.name||'Chưa gắn lớp',rows:[],students:{}}; c.rows.push(a);
   const sid=a.student_id||'none'; const s=c.students[sid]??={name:a.students?.full_name||'Học viên',present:0,absent:0,excused:0,late:0,total:0}; s.total++; if(a.status==='present')s.present++; else if(a.status==='absent')s.absent++; else if(['excused','leave','absent_excused'].includes(a.status))s.excused++; else if(a.status==='late')s.late++;

 ${classes.map(c=>{const ss=Object.values(c.students);const present=ss.reduce((n,s)=>n+s.present,0),absent=ss.reduce((n,s)=>n+s.absent,0),exc=ss.reduce((n,s)=>n+s.excused,0),late=ss.reduce((n,s)=>n+s.late,0);return `<div class="card"><div class="row"><div><h2>${esc(c.name)}</h2><div class="muted">${ss.length} học viên có dữ liệu trong tháng</div></div><span class="badge">${c.rows.length} lượt</span></div><div class="grid" style="margin:10px 0"><div class="kpi"><span class="muted">Có mặt</span><b>${present}</b></div><div class="kpi"><span class="muted">Vắng</span><b>${absent}</b></div><div class="kpi"><span class="muted">Nghỉ phép</span><b>${exc}</b></div><div class="kpi"><span class="muted">Đi muộn</span><b>${late}</b></div></div>${ss.map(s=>`<div class="item"><div class="row"><b>${esc(s.name)}</b><span class="badge ${s.absent?'warn':'ok'}">${s.present}/${s.total} có mặt</span></div><div class="small muted" style="margin-top:5px">Vắng ${s.absent} · Nghỉ phép ${s.excused} · Đi muộn ${s.late}</div></div>`).join('')}</div>`}).join('')||'<div class="card"><div class="muted">Tháng này chưa có dữ liệu điểm danh.</div></div>'}`;
}

<script>
// ===== MINDANCE CALENDAR BATCH FIX =====
// 1) Remove duplicate "Tháng này" card from Admin Home.
// 2) Replace weekly-only "Thêm buổi học" flow with exact-date multi-select monthly calendar.

const mdCalBaseHome = window.openHome;
window.openHome = async function(){
  await mdCalBaseHome();
  if(profile?.role!=='admin') return;
  const root=$('content'); if(!root) return;
  [...root.querySelectorAll('.card')].forEach(card=>{
    const h2=card.querySelector('h2');
    if((h2?.textContent||'').trim()==='Tháng này') card.remove();
  });
};

window.mdBatchSelectedDates = new Set();
window.mdBatchMonth = new Date().toISOString().slice(0,7);
window.mdBatchClassId = null;
window.mdBatchExisting = [];
window.mdBatchRooms = [];

function mdBatchMonthParts(month){
  const [y,m]=month.split('-').map(Number);
  return {y,m};
}
function mdBatchShiftMonth(month,delta){
  const {y,m}=mdBatchMonthParts(month);
  const d=new Date(Date.UTC(y,m-1+delta,1));
  return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}`;
}
function mdBatchDateKey(y,m,d){
  return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}
function mdBatchDateLabel(date){
  const [y,m,d]=date.split('-');
  return `${Number(d)}/${Number(m)}/${y}`;
}
function mdBatchCalendarHtml(){
  const {y,m}=mdBatchMonthParts(window.mdBatchMonth);
  const first=new Date(Date.UTC(y,m-1,1));
  const days=new Date(Date.UTC(y,m,0)).getUTCDate();
  const mondayIndex=(first.getUTCDay()+6)%7; // Monday=0
  const existingByDate=new Map();
  (window.mdBatchExisting||[]).forEach(x=>{
    if((x.session_date||'').slice(0,7)===window.mdBatchMonth){
      if(!existingByDate.has(x.session_date)) existingByDate.set(x.session_date,[]);
      existingByDate.get(x.session_date).push(x);
    }
  });

  let cells='';
  for(let i=0;i<mondayIndex;i++) cells+='<div class="md-cal-empty"></div>';
  for(let d=1;d<=days;d++){
    const key=mdBatchDateKey(y,m,d);
    const selected=window.mdBatchSelectedDates.has(key);
    const existing=existingByDate.get(key)||[];
    const hasExisting=existing.length>0;
    cells+=`<button type="button" class="md-cal-day ${selected?'selected':''} ${hasExisting?'has-existing':''}" onclick="mdBatchToggleDate('${key}')">
      <span>${d}</span>
      ${hasExisting?`<small>${existing.length} buổi</small>`:''}
      ${selected?'<b>✓</b>':''}
    </button>`;
  }
  return `<div class="md-cal-head"><button type="button" class="btn" onclick="mdBatchMoveMonth(-1)">‹</button><b>Tháng ${m}/${y}</b><button type="button" class="btn" onclick="mdBatchMoveMonth(1)">›</button></div>
    <div class="md-cal-week"><span>T2</span><span>T3</span><span>T4</span><span>T5</span><span>T6</span><span>T7</span><span>CN</span></div>
    <div class="md-cal-grid">${cells}</div>`;
}
function mdBatchRenderCalendar(){
  const el=$('mdBatchCalendar'); if(el) el.innerHTML=mdBatchCalendarHtml();
  const sel=$('mdBatchSelectedText');
  if(sel){
    const arr=[...window.mdBatchSelectedDates].sort();
    sel.innerHTML=arr.length
      ? `<b>Đã chọn ${arr.length} buổi</b><div class="small muted">${arr.map(mdBatchDateLabel).join(' · ')}</div>`
      : '<span class="muted">Chạm vào các ngày trên lịch để chọn nhiều buổi cùng lúc.</span>';
  }
}
window.mdBatchToggleDate=function(date){
  if(window.mdBatchSelectedDates.has(date)) window.mdBatchSelectedDates.delete(date);
  else window.mdBatchSelectedDates.add(date);
  mdBatchRenderCalendar();
};
window.mdBatchMoveMonth=function(delta){
  window.mdBatchMonth=mdBatchShiftMonth(window.mdBatchMonth,delta);
  mdBatchRenderCalendar();
};

window.openClassSchedulesAdmin = async function(classId){
  if(!admin()) return;
  const now=new Date();
  const month=window.mdBatchMonth||`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const {y,m}=mdBatchMonthParts(month);
  const from=`${y}-${String(m).padStart(2,'0')}-01`;
  const to=`${y}-${String(m).padStart(2,'0')}-${String(new Date(y,m,0).getDate()).padStart(2,'0')}`;
  const [{data:c,error:ce},{data:s,error:se}]=await Promise.all([
    supa.from('classes').select('id,name').eq('id',classId).single(),
    supa.from('class_sessions').select('id,class_id,session_date,start_time,end_time,status,rooms(name)')
      .eq('class_id',classId).gte('session_date',from).lte('session_date',to)
      .order('session_date').order('start_time')
  ]);
  if(ce||se) return alert((ce||se).message);
  const rows=s||[];
  $('content').innerHTML=`<div class="card">
    <div class="row">
      <div><h2>Lịch · ${esc(c.name)}</h2><div class="muted">Các buổi học cụ thể theo tháng</div></div>
      <button class="btn" onclick="openClassesAdmin()">Quay lại</button>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="btn" onclick="mdClassMonth('${classId}',-1)">‹ Tháng trước</button>
      <b>Tháng ${m}/${y}</b>
      <button class="btn" onclick="mdClassMonth('${classId}',1)">Tháng sau ›</button>
    </div>
    <div class="notice" style="margin-top:10px"><b>${rows.length} buổi trong tháng</b><div class="small">Dùng lịch ngày để tạo đúng số buổi thực tế của lớp.</div></div>
    <div class="stack" style="margin-top:10px">
      ${rows.map(x=>`<div class="item"><div class="row"><div><b>${mdBatchDateLabel(x.session_date)} · ${String(x.start_time||'').slice(0,5)}–${String(x.end_time||'').slice(0,5)}</b><div class="muted">${esc(x.rooms?.name||'Chưa xếp phòng')}</div></div><span class="badge ${x.status==='cancelled'?'danger':x.status==='completed'?'ok':''}">${x.status==='cancelled'?'Đã hủy':x.status==='completed'?'Đã học':'Đã lập lịch'}</span></div></div>`).join('')||'<div class="muted">Tháng này chưa có buổi học.</div>'}
    </div>
    <button class="btn primary full" style="margin-top:12px" onclick="showAddClassSchedule('${classId}')">📅 Lập nhiều buổi theo ngày</button>
  </div>`;
};
window.mdClassMonth=function(classId,delta){
  window.mdBatchMonth=mdBatchShiftMonth(window.mdBatchMonth||new Date().toISOString().slice(0,7),delta);
  openClassSchedulesAdmin(classId);
};

window.showAddClassSchedule = async function(classId){
  if(!admin()) return;
  window.mdBatchClassId=classId;

window.saveClassSchedule = async function(classId){
  if(!admin()) return;
  const dates=[...window.mdBatchSelectedDates].sort();
  const start=$('scStart')?.value,end=$('scEnd')?.value,room=$('scRoom')?.value||null;
  if(!dates.length) return alert('Vui lòng chọn ít nhất 1 ngày trên lịch.');
  if(!start||!end||end<=start) return alert('Giờ kết thúc phải sau giờ bắt đầu.');

  const from=dates[0],to=dates[dates.length-1];
  const {data:old,error:oe}=await supa.from('class_sessions')
    .select('id,session_date,start_time,end_time,status')
    .eq('class_id',classId).gte('session_date',from).lte('session_date',to);
  if(oe) return alert(oe.message);

  const duplicate=new Set((old||[]).filter(x=>x.status!=='cancelled').map(x=>`${x.session_date}|${String(x.start_time||'').slice(0,5)}|${String(x.end_time||'').slice(0,5)}`));
  const rows=dates.filter(d=>!duplicate.has(`${d}|${start}|${end}`)).map(d=>({
    class_id:classId,
    schedule_id:null,
    session_date:d,
    start_time:start,
    end_time:end,
    room_id:room,
    status:'planned',
    note:'Lập lịch thủ công theo tháng'
  }));
  const skipped=dates.length-rows.length;
  if(!rows.length) return alert('Các ngày đã chọn đều đã có buổi học cùng khung giờ.');

  const {data,error}=await supa.from('class_sessions').insert(rows).select('id,session_date');
  if(error) return alert('Không tạo được lịch: '+error.message);
  try{ await audit('batch_create','class_sessions',null,{class_id:classId,count:rows.length,dates:rows.map(x=>x.session_date)}); }catch(_){}
  alert(`✅ Đã tạo ${rows.length} buổi${skipped?` · bỏ qua ${skipped} buổi trùng`:''}.`);
  window.mdBatchSelectedDates=new Set();
  openClassSchedulesAdmin(classId);
};

<script>

window.mdSchedMonth = window.mdSchedMonth || mdMonthValue();
window.mdSchedExpanded = null;

function mdShiftMonth(v, delta){
  const [y,m]=v.split('-').map(Number);
  const d=new Date(y,m-1+delta,1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function mdMonthRange(v){
  const [y,m]=v.split('-').map(Number);
  const last=new Date(y,m,0).getDate();
  return {from:`${v}-01`,to:`${v}-${String(last).padStart(2,'0')}`,y,m};
}
function mdSessionStatus(x){
  if(x.status==='cancelled') return '<span class="badge danger">Đã hủy</span>';
  if(x.status==='completed') return '<span class="badge ok">Đã học</span>';
  const today=(typeof v104Today==='function'?v104Today():new Date().toISOString().slice(0,10));
  if(x.session_date===today) return '<span class="badge ok">Hôm nay</span>';
  if(x.session_date<today) return '<span class="badge warn">Đã qua</span>';
  return '<span class="badge">Sắp tới</span>';
}

window.mdScheduleMoveMonth=function(delta){
  window.mdSchedMonth=mdShiftMonth(window.mdSchedMonth||mdMonthValue(),delta);
  window.mdSchedExpanded=null;
  openSchedule();
};
window.mdToggleScheduleClass=function(classId){
  window.mdSchedExpanded = window.mdSchedExpanded===classId ? null : classId;
  const box=document.querySelector(`[data-md-sessions="${classId}"]`);
  const chev=document.querySelector(`[data-md-chev="${classId}"]`);
  if(box){
    const open=box.style.display!=='none';
    document.querySelectorAll('[data-md-sessions]').forEach(x=>x.style.display='none');
    document.querySelectorAll('[data-md-chev]').forEach(x=>x.textContent='›');
    if(!open){ box.style.display='block'; if(chev)chev.textContent='⌄'; }
  }
};

window.openSchedule=async function(){
  if(!active()) return;
  if(!['admin','teacher'].includes(profile?.role)) return mdClassScheduleBase();

  try{
    const month=window.mdSchedMonth||mdMonthValue();

function mdPayrollFormula(type,rate){
  const r=mdMoney(rate||0);
  if(type==='monthly') return `Lương cố định mỗi tháng: ${r}`;
  if(type==='per_hour') return `${r} × tổng số giờ chấm công`;
  if(type==='per_day') return `${r} × số ngày có chấm công`;
  return `${r} × số buổi chấm công`;
}
function mdPayrollTypeOptions(v){
  return [
    ['per_session','Theo buổi'],
    ['per_hour','Theo giờ'],
    ['per_day','Theo ngày'],
    ['monthly','Lương tháng']
  ].map(([x,t])=>`<option value="${x}" ${x===v?'selected':''}>${t}</option>`).join('');
}
window.mdPayrollExplain=function(id){
  const t=document.getElementById(`mdPayType_${id}`)?.value||'per_session';
  const r=Number(document.getElementById(`mdPayRate_${id}`)?.value||0);
  const el=document.getElementById(`mdPayFormula_${id}`);
  if(el) el.textContent=mdPayrollFormula(t,r);
};
window.mdSavePayrollForm=async function(teacherId,month){
  const type=document.getElementById(`mdPayType_${teacherId}`)?.value;
  const raw=document.getElementById(`mdPayRate_${teacherId}`)?.value||'0';
  const rate=Number(String(raw).replace(/[^0-9.]/g,''));
  if(!type||!Number.isFinite(rate)||rate<0) return alert('Vui lòng nhập cách tính và mức lương hợp lệ.');
  const {error}=await supa.rpc('admin_set_teacher_payroll',{p_teacher:teacherId,p_pay_type:type,p_rate:rate});
  if(error) return alert(error.message);
  alert('✅ Đã lưu cách tính lương. Bảng lương tạm tính sẽ dùng mức mới.');
  mdAdminPayroll(month);
};

    </div>
    <div class="grid">
      <div class="card"><div class="small muted">Số buổi công</div><div style="font-size:24px;font-weight:800">${p.work_units??p.work_sessions??0}</div></div>
      <div class="card"><div class="small muted">Lương gộp</div><div style="font-size:24px;font-weight:800">${mdMoney(gross)}</div></div>

      <div class="card"><div class="small muted">Thực nhận</div><div style="font-size:24px;font-weight:800">${mdMoney(net)}</div></div>

};

<script>

window.v12OpenStudentPayments=async function(studentId){
 const [{data:s},{data:packs,error}]=await Promise.all([
  supa.from('students').select('full_name').eq('id',studentId).single(),
  supa.from('package_purchases').select('id,package_name_snapshot,price_snapshot,status,end_date,created_at,payments(amount,paid_at,method)').eq('student_id',studentId).neq('status','cancelled').order('created_at',{ascending:false})
 ]); if(error)return alert(error.message);

 $('content').innerHTML=`<div class="card"><h2>Học phí · ${esc(s?.full_name||'')}</h2><div class="muted">Chỉ hiển thị gói đang hoạt động hoặc còn nợ.</div>${visible.map(p=>{const paid=(p.payments||[]).reduce((a,b)=>a+Number(b.amount||0),0),due=Math.max(0,Number(p.price_snapshot||0)-paid);return `<div class="item"><div class="row"><div><b>${esc(p.package_name_snapshot||'')}</b><div class="muted">Đã thu ${money(paid)} · còn ${money(due)}</div></div><span class="badge ${due<=0?'ok':'warn'}">${due<=0?'Đang hoạt động':'Còn nợ'}</span></div>${due>0?`<button class="btn primary full" style="margin-top:8px" onclick="openPaymentQR('${p.id}','${studentId}')">📱 QR thanh toán</button>`:''}</div>`}).join('')||'<div class="muted">Không có gói đang hoạt động hoặc khoản học phí còn nợ.</div>'}</div>`;

window.mdAdminClassMembers=async function(classId,month=mdRoleMonthValue()){

 const [{data:c},{data:enrs,error:e1},{data:att,error:e2}]=await Promise.all([

};

 const map={};for(const a of(att||[])){const s=map[a.class_id]??={present:0,absent:0,excused:0,late:0,total:0};s.total++;if(a.status==='present')s.present++;else if(a.status==='absent')s.absent++;else if(['excused','leave','absent_excused'].includes(a.status))s.excused++;else if(a.status==='late')s.late++;}
 $('content').innerHTML=`<div class="card"><div class="row"><div><h2>📋 Báo cáo điểm danh</h2><div class="muted">Tổng quan theo lớp. Bấm Thành viên khi cần xem từng học viên.</div></div><button class="btn" onclick="openHome()">Trang chủ</button></div><div class="row" style="margin-top:10px"><button class="btn" onclick="mdAdminProgress('${mdRoleShiftMonth(month,-1)}')">‹</button><b>${mdRoleMonthLabel(month)}</b><button class="btn" onclick="mdAdminProgress('${mdRoleShiftMonth(month,1)}')">›</button></div></div>${(classes||[]).map(c=>{const s=map[c.id]||{present:0,absent:0,excused:0,late:0,total:0};return `<div class="card"><div class="row"><div><h2>${esc(c.name)}</h2><div class="muted">${s.total} lượt điểm danh trong tháng</div></div><button class="btn" onclick="mdAdminClassMembers('${c.id}','${month}')">👥 Thành viên</button></div><div class="grid" style="margin-top:10px"><div class="kpi"><span class="muted">Có mặt</span><b>${s.present}</b></div><div class="kpi"><span class="muted">Vắng</span><b>${s.absent}</b></div><div class="kpi"><span class="muted">Nghỉ phép</span><b>${s.excused}</b></div><div class="kpi"><span class="muted">Đi muộn</span><b>${s.late}</b></div></div></div>`}).join('')||'<div class="card"><div class="muted">Chưa có lớp hoạt động.</div></div>'}`;

         <div class="row">

const mdStableStudentProgressBase=window.mdStudentProgress;
window.mdStudentProgress=async function(month=mdRoleMonthValue()){
  if(!['student'].includes(profile?.role)) return mdStableStudentProgressBase(month);

  const {students,student}=await mdFocusedStudent();

  const rows=data||[];

    ? `<label>Học viên</label><select onchange="localStorage.setItem(mdStudentFocusKey(),this.value);mdStudentProgress('${month}')">${students.map(s=>`<option value="${s.id}" ${s.id===student.id?'selected':''}>${esc(s.full_name)}</option>`).join('')}</select>`

      <button class="btn" onclick="mdStudentProgress('${mdRoleShiftMonth(month,1)}')">›</button>
    </div>
  </div>
  ${rows.map(c=>{
    const seen=new Set();
    const clean=(c.attendance_rows||[]).filter(a=>{
      const k=String(a.date);
      if(seen.has(k)) return false;
      seen.add(k); return true;
    });
    const cnt={present:0,absent:0,excused:0,late:0};
    clean.forEach(a=>{
      if(a.status==='present')cnt.present++;
      else if(a.status==='absent')cnt.absent++;
      else if(['excused','leave','absent_excused'].includes(a.status))cnt.excused++;
      else if(a.status==='late')cnt.late++;
    });
    return `<div class="card">
      <div><h2>${esc(c.class_name)}</h2><div class="muted">${clean.length} buổi đã được giáo viên ghi nhận</div></div>

        <div class="kpi"><span class="muted">Đi muộn</span><b>${cnt.late}</b></div>
      </div>
      ${clean.map(a=>`<div class="item"><div class="row"><div><b>${v12DateVN(a.date)}</b>${a.time?`<div class="small muted">${String(a.time).slice(0,5)}</div>`:''}</div><span class="badge ${mdFlowStatusBadge(a.status)}">${mdFlowStatusLabel(a.status)}</span></div>${a.note?`<div class="small muted" style="margin-top:5px">${esc(a.note)}</div>`:''}</div>`).join('')}
    </div>`;
  }).join('')||'<div class="card"><div class="muted">Tháng này chưa có dữ liệu điểm danh.</div></div>'}`;
};

window.createPackage=async function(){
  const type=$('pType').value, months=Number($('pMonths').value||0)||null;
  const spm=type==='Theo tháng'?(Number($('pSessionsMonth').value||0)||null):null;
  const uses=type==='Theo tháng'?(months&&spm?months*spm:null):(Number($('pUses').value||0)||null);
  const comboClasses=[...document.querySelectorAll('[data-combo-class]:checked')].map(x=>x.value);
  if(type==='Theo tháng'&&(!months||!spm))return alert('Gói theo tháng cần số tháng và số buổi mỗi tháng.');
  if(type==='Combo'&&comboClasses.length<2)return alert('Combo cần ít nhất 2 lớp.');
  if(type==='Combo'&&!uses)return alert('Combo cần nhập tổng số buổi dùng chung.');
  const payload={name:$('pName').value.trim(),package_type:type,price:Number($('pPrice').value||0),duration_months:months,sessions_per_month:spm,total_uses:uses,makeup_allowed:$('pMakeup').value==='true',makeup_valid_days:Number($('pMakeupDays').value||30),active:true};
  if(!payload.name)return alert('Nhập tên gói.');
  const {data,error}=await supa.from('packages').insert(payload).select().single();
  if(error)return alert(error.message);
  if(type==='Combo'){
    const r=await supa.rpc('admin_save_package_classes',{p_package_id:data.id,p_class_ids:comboClasses});
    if(r.error)return alert(r.error.message);
  }
  await audit('create','package',data.id,payload);
  openPackages();
};

const mdFix04ClassSchedulesBase=window.openClassSchedulesAdmin;
window.openClassSchedulesAdmin=async function(classId){
  await mdFix04ClassSchedulesBase(classId);
  if(profile?.role!=='admin')return;

  const root=$('content'); if(!root)return;
  const {data,error}=await supa.from('class_sessions')
    .select('id,class_id,session_date,start_time,end_time,status')
    .eq('class_id',classId)
    .order('session_date').order('start_time');
  if(error)return;

  const byKey=new Map((data||[]).map(x=>[
    `${x.session_date}|${String(x.start_time||'').slice(0,5)}|${String(x.end_time||'').slice(0,5)}`,x
  ]));

  [...root.querySelectorAll('.item')].forEach(item=>{
    const b=item.querySelector('b'); if(!b)return;

    const m=txt.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})\s*·\s*(\d{2}:\d{2})[–-](\d{2}:\d{2})/);
    if(!m)return;
    const key=`${m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}|${m[4]}|${m[5]}`;
    const s=byKey.get(key); if(!s || item.querySelector('[data-md-session-state]'))return;

    const wrap=document.createElement('div');
    wrap.setAttribute('data-md-session-state','1');
    wrap.style.marginTop='8px';

      wrap.innerHTML=`<button class="btn danger full" onclick="mdAdminSetSessionStatus('${s.id}','cancelled','${classId}')">⛔ Hủy buổi học</button>`;

<script>
// ===== MINDANCE STABLE FIX 07 =====
// Consolidated repair after FIX 06:
// A) Admin session management is rendered directly (no DOM text parsing).
// B) Student class/package self-registration is restored as a first-class Home action.
// C) Existing combo, launch, finance, attendance and teacher-expense logic from FIX 06 is preserved.

// ---------- A. ADMIN: DIRECT SESSION MANAGEMENT ----------
window.mdAdminSetSessionStatus = async function(sessionId, status, classId){
  if(profile?.role !== 'admin') return;
  if(!['planned','cancelled'].includes(status)) return alert('Trạng thái không hợp lệ.');

  const msg = status === 'cancelled'
    ? 'Hủy buổi học này? Buổi vẫn được giữ lại trong lịch sử.'
    : 'Mở lại buổi học này?';
  if(!confirm(msg)) return;

  const {error} = await supa.rpc('admin_set_class_session_status',{
    p_session_id: sessionId,
    p_status: status
  });
  if(error) return alert(error.message);

  alert(status === 'cancelled' ? '✅ Đã hủy buổi học.' : '✅ Đã mở lại buổi học.');
  await openClassSchedulesAdmin(classId);
};

window.openClassSchedulesAdmin = async function(classId){
  if(profile?.role !== 'admin') return;

  const month = window.mdBatchMonth || new Date().toISOString().slice(0,7);
  window.mdBatchMonth = month;
  const [y,m] = month.split('-').map(Number);
  const from = `${month}-01`;
  const last = new Date(y,m,0).getDate();
  const to = `${month}-${String(last).padStart(2,'0')}`;

  const [{data:c,error:ce},{data:s,error:se}] = await Promise.all([
    supa.from('classes').select('id,name').eq('id',classId).single(),
    supa.from('class_sessions')
      .select('id,class_id,session_date,start_time,end_time,status,rooms(name)')
      .eq('class_id',classId)
      .gte('session_date',from)
      .lte('session_date',to)
      .order('session_date')
      .order('start_time')
  ]);
  if(ce || se) return alert((ce||se).message);

  const rows = s || [];
  $('content').innerHTML = `<div class="card">
    <div class="row">
      <div>
        <h2>Lịch · ${esc(c.name)}</h2>
        <div class="muted">Quản lý chính xác từng buổi của lớp</div>
      </div>
      <button class="btn" onclick="openClassesAdmin()">Quay lại</button>
    </div>

    <div class="row" style="margin-top:12px">
      <button class="btn" onclick="mdClassMonth('${classId}',-1)">‹ Tháng trước</button>
      <b>Tháng ${m}/${y}</b>
      <button class="btn" onclick="mdClassMonth('${classId}',1)">Tháng sau ›</button>
    </div>

    <div class="notice" style="margin-top:10px">
      <b>${rows.length} buổi trong tháng</b>
      <div class="small">Buổi nghỉ vẫn được lưu với trạng thái Đã hủy, không bị xóa khỏi lịch sử.</div>
    </div>

    <div class="stack" style="margin-top:10px">
      ${rows.map(x=>`<div class="item">
        <div class="row">
          <div>
            <b>${mdBatchDateLabel(x.session_date)} · ${String(x.start_time||'').slice(0,5)}–${String(x.end_time||'').slice(0,5)}</b>
            <div class="muted">${esc(x.rooms?.name||'Chưa xếp phòng')}</div>
          </div>
          <span class="badge ${x.status==='cancelled'?'danger':x.status==='completed'?'ok':''}">
            ${x.status==='cancelled'?'Đã hủy':x.status==='completed'?'Đã học':'Đã lập lịch'}
          </span>
        </div>

        ${x.status==='planned'
          ? `<button class="btn danger full" style="margin-top:9px" onclick="mdAdminSetSessionStatus('${x.id}','cancelled','${classId}')">⛔ Hủy buổi học</button>`
          : x.status==='cancelled'
            ? `<button class="btn full" style="margin-top:9px" onclick="mdAdminSetSessionStatus('${x.id}','planned','${classId}')">↩️ Mở lại buổi học</button>`
            : `<div class="small muted" style="margin-top:8px">Buổi đã hoàn thành nên không đổi trạng thái.</div>`
        }
      </div>`).join('') || '<div class="muted">Tháng này chưa có buổi học.</div>'}
    </div>

    <button class="btn primary full" style="margin-top:12px" onclick="showAddClassSchedule('${classId}')">📅 Lập nhiều buổi theo ngày</button>
    <button class="btn full" style="margin-top:8px" onclick="mdClassZaloAdmin('${classId}','${esc(c.name)}')">💬 Nhóm Zalo & QR lớp</button>
  </div>`;
};

// ---------- B. STUDENT: DIRECT SELF-SERVICE CLASS/PACKAGE HUB ----------
window.mdStudentDiscover = async function(){
  if(!['student'].includes(profile?.role)) return;
  return v125ClassesHub('discover');
};

// Final learner Home. Do not depend on finding/injecting an older "Truy cập nhanh" card.
const mdFix07HomeBase = window.openHome;
window.openHome = async function(){
  if(!active()) return;
  if(!['student'].includes(profile?.role)) return mdFix07HomeBase();

  try{
    const {students,student} = await mdFocusedStudent();
    if(!student) return alert('Chưa có hồ sơ học viên.');

    let ptCount = 0;
    try{
      ptCount = ((typeof v129NotificationRows==='function' ? await v129NotificationRows() : []) || []).length;
    }catch(_){}

    let due = 0;
    try{
      const {data:purchases} = await supa.from('package_purchases')
        .select('id,price_snapshot,status,student_id')
        .eq('student_id',student.id)
        .neq('status','cancelled');
      const ids=(purchases||[]).map(x=>x.id);
      let paidMap={};
      if(ids.length){
        const {data:payments}=await supa.from('payments').select('purchase_id,amount').in('purchase_id',ids);
        (payments||[]).forEach(x=>paidMap[x.purchase_id]=(paidMap[x.purchase_id]||0)+Number(x.amount||0));
      }
      due=(purchases||[]).reduce((a,x)=>a+Math.max(0,Number(x.price_snapshot||0)-Number(paidMap[x.id]||0)),0);
    }catch(_){}

    let next=null;
    try{
      const {data}=await supa.rpc('student_month_schedule',{
        p_student_id:student.id,
        p_month:mdFlowMonthDate(mdFlowMonthValue())
      });
      const today=new Date().toISOString().slice(0,10);
      next=(data||[])
        .filter(x=>x.session_status!=='cancelled' && x.session_date>=today)
        .sort((a,b)=>`${a.session_date} ${a.start_time}`.localeCompare(`${b.session_date} ${b.start_time}`))[0]||null;
    }catch(_){}

    $('content').innerHTML=`
      <div class="card">
        <h2 style="margin-bottom:2px">Xin chào 👋</h2>
        <div class="muted">${esc(student.full_name||'Học viên')}</div>
        ${students.length>1?`<label>Học viên</label><select onchange="localStorage.setItem(mdStudentFocusKey(),this.value);openHome()">${students.map(s=>`<option value="${s.id}" ${s.id===student.id?'selected':''}>${esc(s.full_name)}</option>`).join('')}</select>`:''}
      </div>

      <div class="card">
        <h2>Truy cập nhanh</h2>
        <div class="grid" style="gap:10px">
          ${mdFlowTile('👥','Lớp & gói học','Xem lớp và tự đăng ký','mdStudentDiscover()')}
          ${mdFlowTile('🤝','PT 1:1','Đặt lịch & theo dõi','v127Hub()',ptCount,ptCount>0)}
          ${mdFlowTile('💳','Học phí',due>0?`Còn ${mdMoney(due)}`:'Không có khoản cần thanh toán','v124PaymentsChooser()',due>0?1:0,due>0)}
          ${mdFlowTile('🎭','Bài sắp khai giảng','Theo dõi bài yêu thích','mdUpcomingLaunches()')}
        </div>
      </div>

      <div class="card">
        <div class="row">
          <div><h2>Buổi học gần nhất</h2><div class="muted">Lịch đầy đủ nằm trong mục Lịch học</div></div>
          <button class="btn" onclick="openSchedule()">Xem lịch</button>
        </div>
        ${next
          ? `<div class="item" style="margin-top:10px"><b>${esc(next.class_name||'Lớp học')}</b><div class="muted">${v12DateVN(next.session_date)} · ${v127Time(next.start_time)}–${v127Time(next.end_time)}</div></div>`
          : '<div class="muted" style="margin-top:10px">Chưa có buổi học sắp tới.</div>'
        }
      </div>`;
  }catch(e){
    alert(e.message||'Không tải được Trang chủ học viên.');
  }
};

// Final student navigation: make self-registration permanently visible.
// Keep Lịch học, Điểm danh, Khác; use "Lớp học" instead of hiding discovery behind Home only.
