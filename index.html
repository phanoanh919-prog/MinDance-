<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<title>MinDance</title>
<style>
:root{--bg:#f7f6fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--accent:#7c3aed;--soft:#ede9fe;--ok:#166534;--warn:#92400e;--danger:#b91c1c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text)}
.app{max-width:430px;margin:auto;min-height:100vh;padding-bottom:92px}header{padding:18px 16px 10px}
h1,h2,h3{margin:0}.muted{color:var(--muted);font-size:13px}.small{font-size:12px}
.card{margin:0 16px 12px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stack{display:grid;gap:8px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;font-size:15px;background:white}
textarea{min-height:72px;resize:vertical}label{display:block;font-size:12px;color:var(--muted);margin:8px 0 5px}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 11px;font-weight:700}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.full{width:100%}.btn.danger{color:var(--danger)}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:var(--soft);color:#5b21b6;font-size:11px;font-weight:800}
.badge.warn{background:#fef3c7;color:#92400e}.badge.ok{background:#dcfce7;color:#166534}.badge.danger{background:#fee2e2;color:#991b1b}
.item{border:1px solid var(--line);border-radius:14px;padding:11px;background:#fff}.hidden{display:none!important}.screen{display:none}.screen.active{display:block}
.auth{padding-top:42px}.center{text-align:center}.logo{font-size:48px}.tabs{display:flex;gap:8px;margin:0 16px 12px}
.tab{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px;font-weight:700}.tab.active{background:var(--soft);color:#5b21b6}
.notice{padding:10px 11px;border:1px solid var(--line);border-radius:12px;font-size:13px}.notice.warn{background:#fffbeb;border-color:#fde68a}.notice.ok{background:#f0fdf4;border-color:#bbf7d0}
.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(430px,100%);background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 5px calc(7px + env(safe-area-inset-bottom))}
.nav{border:0;background:transparent;color:var(--muted);font-size:10px;padding:2px}.nav span{display:block;font-size:19px}
.kpi{border:1px solid var(--line);border-radius:14px;padding:12px}.kpi b{display:block;font-size:20px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}
</style>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#7c3aed">
<meta name="application-name" content="MinDance">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MinDance">
</head>
<body>
<div id="offlineBanner" style="display:none;position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:9999;width:min(430px,100%);padding:9px 12px;background:#92400e;color:white;text-align:center;font:600 13px system-ui">Mất kết nối mạng — một số chức năng tạm thời không dùng được</div>
<div id="bootSplash" style="position:fixed;inset:0;z-index:9998;background:#f7f6fb;display:grid;place-items:center">
  <div style="text-align:center;font-family:system-ui">
    <div style="font-size:58px">🩰</div>
    <div style="font-size:22px;font-weight:800;color:#1f2937;margin-top:6px">MinDance</div>
    <div style="font-size:13px;color:#6b7280;margin-top:6px">Đang khởi động…</div>
  </div>
</div>
<div class="app">
<section id="auth" class="screen active auth">
 <div class="center" style="margin-bottom:18px"><div class="logo">🩰</div><h1>MinDance</h1><div class="muted">V2.3 · Admin · Giáo viên · Học viên</div></div>
 <div class="tabs"><button id="tabLogin" class="tab active" onclick="switchAuth('login')">Đăng nhập</button><button id="tabRegister" class="tab" onclick="switchAuth('register')">Đăng ký</button></div>
 <div id="loginPane" class="card">
  <div class="notice ok"><b>Đăng nhập phát triển</b><br>Dùng Email + Password, chưa cần SMS/Twilio.</div>
  <form id="loginForm" onsubmit="return false;">
  <label>Email</label><input id="devEmail" type="email" placeholder="Email" autocomplete="username">
  <label>Mật khẩu</label><input id="devPassword" type="password" placeholder="Mật khẩu" autocomplete="current-password">
  <button id="loginBtn" type="submit" class="btn primary full" style="margin-top:10px;min-height:52px;touch-action:manipulation;position:relative;z-index:2">Đăng nhập</button>
  <div id="loginStatus" class="muted" style="margin-top:8px;text-align:center"></div>
  </form>
  <details style="margin-top:12px"><summary class="muted">Đăng nhập bằng số điện thoại (sau này)</summary>
    <label>Số điện thoại</label><input id="loginPhone" placeholder="+8490...">
    <button class="btn full" style="margin-top:10px" onclick="sendLoginOtp()">Gửi OTP</button>
    <div id="loginOtpBox" class="hidden"><label>OTP</label><input id="loginOtp" maxlength="6"><button class="btn primary full" style="margin-top:10px" onclick="verifyLoginOtp()">Xác minh</button></div>
  </details>
  <button class="btn full" style="margin-top:10px" onclick="showConnectionInfo()">Thông tin kết nối</button>
 </div>
 <div id="registerPane" class="card hidden">
  <label>Số điện thoại</label><input id="regPhone" placeholder="+8490..."><label>Họ tên</label><input id="regName">
  <input id="regRole" type="hidden" value="student">
  <button class="btn primary full" style="margin-top:10px" onclick="sendRegisterOtp()">Gửi OTP</button>
  <div id="regOtpBox" class="hidden"><label>OTP</label><input id="regOtp" maxlength="6"><button class="btn primary full" style="margin-top:10px" onclick="verifyRegisterOtp()">Xác minh & tạo tài khoản</button></div>
 </div>
</section>

<section id="main" class="screen">
 <header><div class="row"><div><h1 id="hello"></h1><div id="roleText" class="muted"></div></div><button class="btn" onclick="logout()">Đăng xuất</button></div></header>
 <div id="content"></div>
 <nav class="bottom">
  <button class="nav" onclick="openHome()"><span>🏠</span>Trang chủ</button>
  <button class="nav" onclick="openStudents()"><span>👧</span>Học viên</button>
  <button class="nav" onclick="openSchedule()"><span>🗓️</span>Lịch</button>
  <button class="nav" onclick="openAttendanceHub()"><span>✅</span>Điểm danh</button>
  <button class="nav" onclick="openMore()"><span>⋯</span>Khác</button>
 </nav>
</section>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
window.DANCE_CONFIG={
  SUPABASE_URL:'https://bbgvctfnhgtjoqlzaqwk.supabase.co',
  SUPABASE_ANON_KEY:'sb_publishable_MwdclCgP7K9iY2rsep8KRg_4M7PXzyU'
};
window.showConnectionInfo=function(){alert('MinDance đang kết nối sẵn với Supabase. Không cần nhập lại API URL hoặc Publishable key.');};
</script>
<script>

const supa=supabase.createClient(DANCE_CONFIG.SUPABASE_URL,DANCE_CONFIG.SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=n=>new Intl.NumberFormat('vi-VN').format(Number(n||0))+' đ';
const dayName=d=>({1:'Thứ 2',2:'Thứ 3',3:'Thứ 4',4:'Thứ 5',5:'Thứ 6',6:'Thứ 7',7:'Chủ nhật'}[d]||'');
let profile=null,regDraft=null;
function switchAuth(m){$('loginPane').classList.toggle('hidden',m!=='login');$('registerPane').classList.toggle('hidden',m!=='register');$('tabLogin').classList.toggle('active',m==='login');$('tabRegister').classList.toggle('active',m==='register')}
async function sendLoginOtp(){const phone=$('loginPhone').value.trim();const {error}=await supa.auth.signInWithOtp({phone});if(error)return alert(error.message);$('loginOtpBox').classList.remove('hidden')}
async function verifyLoginOtp(){const {error}=await supa.auth.verifyOtp({phone:$('loginPhone').value.trim(),token:$('loginOtp').value.trim(),type:'sms'});if(error)return alert(error.message);boot()}
async function sendRegisterOtp(){regDraft={phone:$('regPhone').value.trim(),full_name:$('regName').value.trim(),role:'student'};if(!regDraft.phone||!regDraft.full_name)return alert('Nhập đủ thông tin.');const {error}=await supa.auth.signInWithOtp({phone:regDraft.phone});if(error)return alert(error.message);$('regOtpBox').classList.remove('hidden')}
async function verifyRegisterOtp(){
 const {data,error}=await supa.auth.verifyOtp({phone:regDraft.phone,token:$('regOtp').value.trim(),type:'sms'});
 if(error)return alert(error.message);
 const {data:bootData,error:bootErr}=await supa.rpc('bootstrap_self_account',{
   p_full_name:regDraft.full_name,
   p_phone:regDraft.phone,
   p_requested_role:regDraft.role
 });
 if(bootErr)return alert(bootErr.message);
 alert(bootData?.status==='active'?'Tài khoản đã sẵn sàng.':'Đã tạo tài khoản, chờ trung tâm duyệt.');
 boot();
}
async function logout(){await supa.auth.signOut();location.reload()}
async function loadProfile(){const {data:{user}}=await supa.auth.getUser();if(!user)return null;const {data}=await supa.from('profiles').select('*').eq('id',user.id).maybeSingle();return data}
async function boot(){profile=await loadProfile();if(!profile)return;$('auth').classList.remove('active');$('main').classList.add('active');$('hello').textContent='Xin chào, '+profile.full_name;$('roleText').textContent='Vai trò: '+profile.role.toUpperCase()+' · '+profile.status;openHome()}
function active(){if(profile.status!=='active'){alert('Tài khoản đang chờ duyệt.');return false}return true}
function admin(){if(profile.role!=='admin'){alert('Chỉ Quản lý được dùng chức năng này.');return false}return true}
async function audit(action,entityType,entityId,details={}){try{await supa.from('audit_logs').insert({actor_user_id:profile?.id,action,entity_type:entityType,entity_id:entityId,details})}catch(e){}}

async function openHome(){
 if(!active()){$('content').innerHTML='<div class="card"><h2>Chờ duyệt tài khoản</h2><div class="muted" style="margin-top:8px">Trung tâm sẽ kích hoạt tài khoản trước khi sử dụng.</div></div>';return}
 await supa.rpc('refresh_expirations');

 if(profile.role==='admin'){
  const [s,c,due,pending]=await Promise.all([
   supa.from('students').select('*',{count:'exact',head:true}),
   supa.from('classes').select('*',{count:'exact',head:true}).eq('active',true),
   supa.rpc('admin_total_outstanding'),
   supa.from('account_requests').select('*',{count:'exact',head:true}).eq('status','pending')
  ]);
  $('content').innerHTML=`<div class="card"><h2>Tổng quan</h2><div class="kpis">
   <div class="kpi"><span class="muted">Học viên</span><b>${s.count||0}</b></div>
   <div class="kpi"><span class="muted">Lớp đang mở</span><b>${c.count||0}</b></div>
   <div class="kpi"><span class="muted">Công nợ</span><b>${money(due.data||0)}</b></div>
   <div class="kpi"><span class="muted">TK chờ duyệt</span><b>${pending.count||0}</b></div>
  </div></div>
  <div class="card"><b>Quản lý nhanh</b><div class="grid" style="margin-top:10px">
   <button class="btn primary" onclick="openStudents()">Học viên</button><button class="btn" onclick="openPackages()">Gói học</button>
   <button class="btn" onclick="openFinance()">Học phí</button><button class="btn" onclick="openReports()">Báo cáo</button>
   <button class="btn" onclick="openAccounts()">Tài khoản</button><button class="btn" onclick="openSettings()">Cài đặt</button>
  </div></div>`;
 }else if(profile.role==='teacher'){
  const {data}=await supa.from('classes').select('*').eq('teacher_user_id',profile.id).eq('active',true).order('name');
  $('content').innerHTML=`<div class="card"><h2>Lớp của tôi</h2>${(data||[]).map(c=>`<div class="item"><b>${esc(c.name)}</b><button class="btn primary full" style="margin-top:8px" onclick="openClassAttendance('${c.id}')">Điểm danh</button></div>`).join('')||'<div class="muted">Chưa có lớp.</div>'}</div>`;
 }else if(profile.role==='student'){
  const {data:s}=await supa.from('students').select('id,full_name,age').eq('user_id',profile.id).maybeSingle();
  if(!s){
   $('content').innerHTML='<div class="card"><h2>Chưa liên kết hồ sơ học viên</h2><div class="muted" style="margin-top:8px">Trung tâm cần liên kết tài khoản này với hồ sơ học viên trước khi sử dụng.</div></div>';
   return;
  }
  const {data:e}=await supa.from('enrollments').select('id,class_id,classes(name),package_purchases(id,package_name_snapshot,status,end_date,remaining_uses)').eq('student_id',s.id).eq('active',true);
  $('content').innerHTML=`<div class="card"><h2>${esc(s.full_name)}</h2><div class="muted">${s.age||''}${s.age?' tuổi':''}</div></div>
  <div class="card"><h2>Các lớp của tôi</h2>${(e||[]).map(x=>`<div class="item"><b>${esc(x.classes?.name||'')}</b><div class="muted">${esc(x.package_purchases?.[0]?.package_name_snapshot||'Chưa có gói')}</div><button class="btn full" style="margin-top:8px" onclick="openStudent('${s.id}')">Xem hồ sơ</button></div>`).join('')||'<div class="muted">Chưa có lớp đang học.</div>'}</div>`;
 }else{
  await supa.rpc('auto_link_current_parent');
  const {data}=await supa.from('guardian_students').select('student_id,students(id,full_name,age)').eq('guardian_user_id',profile.id);
  $('content').innerHTML=`<div class="card"><h2>Học viên của tôi</h2>${(data||[]).map(x=>`<div class="item"><b>${esc(x.students?.full_name)}</b><div class="muted">${x.students?.age||''} tuổi</div><div class="toolbar" style="margin-top:8px"><button class="btn" onclick="openStudent('${x.student_id}')">Hồ sơ</button><button class="btn primary" onclick="showAbsenceRequest('${x.student_id}')">Báo nghỉ</button></div></div>`).join('')||'<div class="muted">Chưa liên kết học viên.</div>'}</div>`;
 }
}







async function openSchedule(){
 if(!active())return;
 const {data}=await supa.from('class_schedules').select(`id,weekday,start_time,end_time,classes(id,name),rooms(name)`).eq('active',true).order('weekday').order('start_time');
 $('content').innerHTML=`<div class="card"><h2>Lịch học tuần</h2>${(data||[]).map(x=>`<div class="item"><b>${dayName(x.weekday)} · ${String(x.start_time).slice(0,5)}–${String(x.end_time).slice(0,5)}</b><div class="muted">${esc(x.classes?.name)} · ${esc(x.rooms?.name||'Chưa xếp phòng')}</div></div>`).join('')||'<div class="muted">Chưa có lịch.</div>'}</div>`;
}

async function openAttendanceHub(){
 if(!active())return;if(!['admin','teacher'].includes(profile.role))return alert('Bạn không có quyền.');
 let q=supa.from('classes').select('*').eq('active',true).order('name');if(profile.role==='teacher')q=q.eq('teacher_user_id',profile.id);
 const {data}=await q;$('content').innerHTML=`<div class="card"><h2>Điểm danh</h2>${(data||[]).map(c=>`<button class="btn full" style="margin-top:8px" onclick="openClassAttendance('${c.id}')">${esc(c.name)}</button>`).join('')}</div>`;
}
async function openClassAttendance(classId){
 const {data:e}=await supa.from('enrollments').select('id,student_id,students(full_name)').eq('class_id',classId).eq('active',true);
 $('content').innerHTML=`<div class="card"><h2>Điểm danh lớp</h2><label>Ngày</label><input id="attDate" type="date" value="${new Date().toISOString().slice(0,10)}"><div id="attRows" class="stack" style="margin-top:10px">${(e||[]).map(x=>`<div class="item" data-e="${x.id}" data-s="${x.student_id}"><b>${esc(x.students?.full_name)}</b><select style="margin-top:8px"><option value="present">Có mặt</option><option value="excused">Nghỉ phép</option><option value="absent">Vắng</option><option value="late">Đi muộn</option></select></div>`).join('')}</div><button class="btn primary full" style="margin-top:10px" onclick="saveAttendance('${classId}')">Lưu điểm danh</button></div>`;
}
async function saveAttendance(classId){for(const r of [...document.querySelectorAll('#attRows [data-e]')]){const {error}=await supa.from('attendance').upsert({class_id:classId,student_id:r.dataset.s,enrollment_id:r.dataset.e,attendance_date:$('attDate').value,status:r.querySelector('select').value},{onConflict:'enrollment_id,attendance_date'});if(error)return alert(error.message)}await audit('save_attendance','class',classId,{date:$('attDate').value});alert('Đã lưu điểm danh. Có mặt sẽ tự trừ 1 buổi trong gói còn hiệu lực.')}

async function openPackages(){
 if(!admin())return;
 const {data}=await supa.from('packages').select('*').order('created_at');
 $('content').innerHTML=`<div class="card"><div class="row"><h2>Gói học</h2><button class="btn primary" onclick="showCreatePackage()">+ Tạo gói</button></div>
 ${(data||[]).map(p=>`<div class="item"><div class="row"><div><b>${esc(p.name)}</b><div class="muted">${esc(p.package_type)} · ${money(p.price)}${p.sessions_per_month?' · '+p.sessions_per_month+' buổi/tháng':''}${p.total_uses?' · '+p.total_uses+' buổi':''}</div></div><span class="badge ${p.active?'ok':'warn'}">${p.active?'Đang dùng':'Tạm ngưng'}</span></div><div class="toolbar" style="margin-top:8px"><button class="btn" onclick="editPackage('${p.id}')">Sửa</button><button class="btn" onclick="duplicatePackage('${p.id}')">Nhân bản</button><button class="btn" onclick="togglePackage('${p.id}',${!p.active})">${p.active?'Tạm ngưng':'Kích hoạt'}</button><button class="btn danger" onclick="deletePackage('${p.id}')">Xóa nếu chưa dùng</button></div></div>`).join('')}</div>`;
}
function showCreatePackage(){if(!admin())return;$('content').innerHTML=`<div class="card"><h2>Tạo gói học</h2><label>Tên gói</label><input id="pName"><label>Loại</label><select id="pType" onchange="updatePackageUsesPreview()"><option>Theo tháng</option><option>Buổi lẻ</option><option>Thẻ gạch</option><option>Tùy chỉnh</option></select><label>Giá</label><input id="pPrice" type="number"><label>Số tháng</label><input id="pMonths" type="number" oninput="updatePackageUsesPreview()"><div id="monthlyUsesBox"><label>Số buổi mỗi tháng</label><input id="pSessionsMonth" type="number" min="1" value="4" oninput="updatePackageUsesPreview()"><div class="notice" id="pUsesPreview">Tổng số buổi sẽ tự tính.</div></div><div id="manualUsesBox" style="display:none"><label>Tổng số lượt</label><input id="pUses" type="number"></div><label>Cho phép học bù</label><select id="pMakeup"><option value="true">Có</option><option value="false">Không</option></select><label>Hạn học bù (ngày)</label><input id="pMakeupDays" type="number" value="30"><button class="btn primary full" style="margin-top:10px" onclick="createPackage()">Lưu gói</button></div>`;updatePackageUsesPreview()}
function updatePackageUsesPreview(){const monthly=$('pType')?.value==='Theo tháng';if($('monthlyUsesBox'))$('monthlyUsesBox').style.display=monthly?'block':'none';if($('manualUsesBox'))$('manualUsesBox').style.display=monthly?'none':'block';if(monthly&&$('pUsesPreview')){const m=Number($('pMonths')?.value||0),n=Number($('pSessionsMonth')?.value||0);$('pUsesPreview').textContent=m&&n?`${m} tháng × ${n} buổi = ${m*n} buổi`:'Nhập số tháng và số buổi/tháng để tự tính tổng.'}}
async function createPackage(){const type=$('pType').value,months=Number($('pMonths').value||0)||null,spm=type==='Theo tháng'?(Number($('pSessionsMonth').value||0)||null):null,uses=type==='Theo tháng'?(months&&spm?months*spm:null):(Number($('pUses').value||0)||null);if(type==='Theo tháng'&&(!months||!spm))return alert('Gói theo tháng cần nhập Số tháng và Số buổi mỗi tháng.');const payload={name:$('pName').value.trim(),package_type:type,price:Number($('pPrice').value||0),duration_months:months,sessions_per_month:spm,total_uses:uses,makeup_allowed:$('pMakeup').value==='true',makeup_valid_days:Number($('pMakeupDays').value||30),active:true};const {data,error}=await supa.from('packages').insert(payload).select().single();if(error)return alert(error.message);await audit('create','package',data.id,payload);openPackages()}

async function signInWithEmailPassword(){
  const email=($('devEmail')?.value||'').trim();
  const password=$('devPassword')?.value||'';
  const btn=$('loginBtn');
  const status=$('loginStatus');
  if(!email||!password){ alert('Nhập email và mật khẩu.'); return false; }
  try{
    if(btn){btn.disabled=true;btn.textContent='Đang đăng nhập…';}
    if(status)status.textContent='Đang kết nối Supabase…';
    const {data,error}=await supa.auth.signInWithPassword({email,password});
    if(error)throw error;
    if(status)status.textContent='Đăng nhập thành công.';
    await boot();
    if(!$('main')?.classList.contains('active')) alert('Đã đăng nhập nhưng chưa tải được hồ sơ tài khoản.');
  }catch(err){
    console.error('Login error',err);
    if(status)status.textContent='Đăng nhập chưa thành công.';
    alert(err?.message||'Không thể đăng nhập. Hãy thử lại.');
  }finally{
    if(btn){btn.disabled=false;btn.textContent='Đăng nhập';}
  }
  return false;
}

function bindMobileLogin(){
  const form=$('loginForm'), btn=$('loginBtn');
  if(form && !form.dataset.bound){
    form.dataset.bound='1';
    form.addEventListener('submit',e=>{e.preventDefault();signInWithEmailPassword();});
  }
  if(btn && !btn.dataset.touchBound){
    btn.dataset.touchBound='1';
    btn.addEventListener('click',e=>{e.preventDefault();signInWithEmailPassword();});
  }
}
window.addEventListener('DOMContentLoaded',bindMobileLogin);
window.addEventListener('load',bindMobileLogin);
setTimeout(bindMobileLogin,300);


async function signUpDevAccount(){
  const email=($('devEmail')?.value||'').trim();
  const password=$('devPassword')?.value||'';
  const full_name=($('devName')?.value||'').trim();
  const role=$('devRole')?.value||'student';
  if(!email||!password||!full_name)return alert('Nhập họ tên, email và mật khẩu.');
  if(password.length<6)return alert('Mật khẩu tối thiểu 6 ký tự.');
  if(!['student'].includes(role))return alert('Chỉ Parent/Student được tự đăng ký.');

  const {data,error}=await supa.auth.signUp({
    email,password,
    options:{data:{full_name,requested_role:role}}
  });
  if(error)return alert(error.message);

  // If email confirmation is off, session exists and we can bootstrap immediately.
  if(data.session){
    const {error:bootErr}=await supa.rpc('bootstrap_dev_account',{
      p_full_name:full_name,
      p_email:email,
      p_requested_role:role
    });
    if(bootErr)return alert(bootErr.message);
    alert('Đã tạo tài khoản test.');
    boot();
  }else{
    alert('Đã tạo tài khoản. Nếu Supabase yêu cầu xác nhận email, hãy xác nhận rồi đăng nhập lại.');
  }
}

async function saveStudentClasses(studentId){
 const chosen=new Set([...document.querySelectorAll('#classChecks input[type=checkbox]:checked')].map(x=>x.value));
 const {data:current,error}=await supa.from('enrollments').select('id,class_id').eq('student_id',studentId).eq('active',true); if(error)return alert(error.message);
 const currentIds=new Set((current||[]).map(x=>x.class_id));
 const add=[...chosen].filter(id=>!currentIds.has(id));
 const remove=(current||[]).filter(x=>!chosen.has(x.class_id));
 if(add.length){const rows=add.map(class_id=>({student_id:studentId,class_id,active:true,start_date:new Date().toISOString().slice(0,10)}));const {error:e}=await supa.from('enrollments').insert(rows);if(e)return alert('Không xếp được lớp: '+e.message);}
 for(const r of remove){const {error:e}=await supa.from('enrollments').update({active:false,end_date:new Date().toISOString().slice(0,10)}).eq('id',r.id);if(e)return alert('Không kết thúc được lớp: '+e.message);}
 await audit('set_classes','student',studentId,{added:add,ended:remove.map(x=>x.class_id)});
 alert('Đã cập nhật lớp học.'); openStudent(studentId);
}

const v99BaseOpenHome = openHome;
function v99AgeFromDob(dob){
  if(!dob)return null;
  const d=new Date(dob+'T00:00:00'); if(Number.isNaN(d.getTime()))return null;
  const n=new Date(); let a=n.getFullYear()-d.getFullYear();
  const m=n.getMonth()-d.getMonth(); if(m<0||(m===0&&n.getDate()<d.getDate()))a--;
  return a>=0?a:null;
}
function v99TypeLabel(t){return t==='child'?'Trẻ em':'Người lớn'}
function v99GenderLabel(g){return ({female:'Nữ',male:'Nam',other:'Khác',unspecified:'Không muốn cung cấp'}[g]||'Chưa chọn')}
function v99ContactText(s){
  return s.student_type==='child'
    ? [s.guardian_name,s.guardian_phone].filter(Boolean).join(' · ')||'Chưa có thông tin phụ huynh'
    : s.student_phone||'Chưa có SĐT học viên';
}

};

// V10.4 · SMART SCHEDULE / REAL CLASS SESSIONS

function v104Today(){ return new Date().toISOString().slice(0,10); }
function v104AddDays(dateStr, days){ const d=new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+days); return d.toISOString().slice(0,10); }
function v104DateLabel(s){ if(!s)return ''; const [y,m,d]=s.split('-'); return `${d}/${m}/${y}`; }
function v104SessionBadge(x){
  const today=v104Today();
  if(x.status==='cancelled') return '<span class="badge danger">Đã hủy</span>';
  if(x.status==='completed') return '<span class="badge ok">Đã học</span>';
  if(x.session_date===today) return '<span class="badge ok">Hôm nay</span>';
  if(x.session_date<today) return '<span class="badge warn">Chưa điểm danh</span>';
  return '<span class="badge">Sắp tới</span>';
}
async function v104GenerateSessions(classId=null, silent=true){
  if(!['admin','teacher'].includes(profile.role)) return 0;
  const from=v104AddDays(v104Today(),-14), to=v104AddDays(v104Today(),60);
  const {data,error}=await supa.rpc('generate_class_sessions',{p_from:from,p_to:to,p_class_id:classId});
  if(error){ if(!silent) alert('Không tạo được buổi học: '+error.message); return null; }
  if(!silent) alert(`Đã đồng bộ lịch. Tạo mới ${data||0} buổi.`);
  return data||0;
}

openSchedule = async function(){
  if(!active())return;
  if(['admin','teacher'].includes(profile.role)) await v104GenerateSessions(null,true);
  const from=v104AddDays(v104Today(),-14), to=v104AddDays(v104Today(),45);
  let q=supa.from('class_sessions')
    .select('id,class_id,schedule_id,session_date,start_time,end_time,status,note,classes(id,name,teacher_user_id),rooms(name)')
    .gte('session_date',from).lte('session_date',to)
    .order('session_date').order('start_time');
  if(profile.role==='teacher') q=q.eq('classes.teacher_user_id',profile.id);
  const {data,error}=await q;
  if(error){
    $('content').innerHTML=`<div class="card"><h2>Lịch học</h2><div class="notice warn">Chưa đọc được buổi học thực tế: ${esc(error.message)}</div></div>`;
    return;
  }
  const rows=data||[];
  const upcoming=rows.filter(x=>x.session_date>=v104Today() && x.status!=='cancelled');
  const recent=rows.filter(x=>x.session_date<v104Today() || x.status==='cancelled').slice(-10).reverse();
  const canAttend=['admin','teacher'].includes(profile.role);
  const render=x=>`<div class="item">
    <div class="row"><div><b>${v104DateLabel(x.session_date)} · ${String(x.start_time).slice(0,5)}–${String(x.end_time).slice(0,5)}</b><div class="muted">${esc(x.classes?.name||'')} · ${esc(x.rooms?.name||'Chưa xếp phòng')}</div></div>${v104SessionBadge(x)}</div>
    ${canAttend && x.status!=='cancelled'?`<div class="toolbar" style="margin-top:8px"><button class="btn primary" onclick="openClassAttendance('${x.class_id}','${x.session_date}','${x.id}')">✅ Điểm danh</button>${profile.role==='admin'?`<button class="btn danger" onclick="v104CancelSession('${x.id}')">Hủy buổi</button>`:''}</div>`:''}
  </div>`;
  $('content').innerHTML=`<div class="card">
    <div class="row"><div><h2>Lịch học</h2><div class="muted">Buổi học thực tế theo ngày</div></div>${canAttend?`<button class="btn" onclick="v104SyncAndRefresh()">↻ Đồng bộ</button>`:''}</div>
    <h3 style="margin-top:14px">Sắp tới</h3><div class="stack" style="margin-top:8px">${upcoming.map(render).join('')||'<div class="muted">Chưa có buổi học sắp tới.</div>'}</div>
    <h3 style="margin-top:16px">Gần đây</h3><div class="stack" style="margin-top:8px">${recent.map(render).join('')||'<div class="muted">Chưa có lịch sử buổi học.</div>'}</div>
  </div>`;
}

async function v104SyncAndRefresh(){ const n=await v104GenerateSessions(null,false); if(n!==null) openSchedule(); }
async function v104CancelSession(id){
  if(profile.role!=='admin')return;

  const {error}=await supa.from('class_sessions').update({status:'cancelled'}).eq('id',id);

  await audit('cancel','class_session',id,{}); openSchedule();
}

saveAttendance = async function(classId, sessionId=null){
  const date=$('attDate').value;
  const rows=[...document.querySelectorAll('#attRows [data-e]')];
  if(!rows.length)return alert('Lớp chưa có học viên để điểm danh.');
  const missing=rows.filter(r=>!r.querySelector('select').value);
  if(missing.length){
    const names=missing.slice(0,3).map(r=>r.querySelector('b')?.textContent||'Học viên').join(', ');
    return alert(`Còn ${missing.length} học viên chưa được điểm danh${names?': '+names:''}.`);
  }
  for(const r of rows){
    const payload={class_id:classId,student_id:r.dataset.s,enrollment_id:r.dataset.e,attendance_date:date,status:r.querySelector('select').value};
    if(sessionId) payload.class_session_id=sessionId;
    const {error}=await supa.from('attendance').upsert(payload,{onConflict:'enrollment_id,attendance_date'});
    if(error)return alert(error.message);
  }
  if(sessionId){
    const {error}=await supa.from('class_sessions').update({status:'completed'}).eq('id',sessionId);
    if(error)return alert('Đã lưu điểm danh nhưng chưa cập nhật trạng thái buổi học: '+error.message);
  }
  await audit('save_attendance','class',classId,{date,session_id:sessionId,count:rows.length});
  alert('Đã lưu điểm danh đầy đủ. Có mặt sẽ tự trừ 1 buổi; đổi trạng thái sau đó sẽ tự hoàn/điều chỉnh lượt.');
  if(sessionId) openSchedule();
}

async function createRoom(){

async function editRoom(id){
  const {data:r,error}=await supa.from('rooms').select('*').eq('id',id).single(); if(error)return alert(error.message);
  const name=prompt('Tên phòng',r.name); if(!name)return;

  const {error:e}=await supa.from('rooms').update(patch).eq('id',id); if(e)return alert(e.message);

async function toggleRoom(id,value){

function v111BankConfigured(s){return !!(s?.bank_code && s?.bank_account_no && s?.bank_account_name)}
function v111SafePaymentCode(v){return String(v||'').replace(/[^A-Za-z0-9]/g,'').toUpperCase().slice(0,25)}
function v111QrUrl(s,amount,code){
  const bank=encodeURIComponent(String(s.bank_code||'').trim());
  const acc=encodeURIComponent(String(s.bank_account_no||'').trim());
  const name=encodeURIComponent(String(s.bank_account_name||'').trim());
  const info=encodeURIComponent(v111SafePaymentCode(code));
  return `https://img.vietqr.io/image/${bank}-${acc}-compact2.png?amount=${Math.round(Number(amount||0))}&addInfo=${info}&accountName=${name}`;
}

async function openPaymentQR(pid,studentId=null){
  if(!admin())return;
  const [{data:s,error:se},{data:o,error:oe}]=await Promise.all([
    supa.from('center_settings').select('bank_code,bank_account_no,bank_account_name,payment_prefix,auto_bank_enabled').eq('id',1).single(),
    supa.rpc('admin_create_payment_order',{p_purchase_id:pid})
  ]);
  if(se)return alert('Cần chạy SQL V11.1 trước: '+se.message);
  if(oe)return alert(oe.message);
  const order=Array.isArray(o)?o[0]:o;
  if(!order)return alert('Không tạo được mã thanh toán.');
  if(!v111BankConfigured(s)){
    $('content').innerHTML=`<div class="card"><h2>Chưa cài tài khoản ngân hàng</h2><div class="notice warn" style="margin-top:10px">Hãy nhập ngân hàng, số tài khoản và tên chủ tài khoản trước khi tạo QR.</div><button class="btn primary full" style="margin-top:12px" onclick="openBankSettings()">Cài tài khoản ngân hàng</button></div>`;
    return;
  }
  const qr=v111QrUrl(s,order.expected_amount,order.payment_code);
  const back=studentId?`openStudent('${studentId}')`:'openFinance()';
  $('content').innerHTML=`<div class="card"><div class="row"><div><h2>QR học phí</h2><div class="muted">Quét để chuyển khoản đúng nội dung</div></div><button class="btn" onclick="${back}">Quay lại</button></div>
    <div class="center" style="margin-top:12px"><img src="${qr}" alt="VietQR" style="width:100%;max-width:330px;border-radius:14px;border:1px solid var(--line)"></div>
    <div class="item" style="margin-top:10px"><div class="small muted">Số tiền</div><b style="font-size:22px">${money(order.expected_amount)}</b><div class="small muted" style="margin-top:8px">Nội dung chuyển khoản</div><b style="font-size:19px;letter-spacing:1px">${esc(order.payment_code)}</b></div>
    <div class="notice ${s.auto_bank_enabled?'ok':''}" style="margin-top:10px">${s.auto_bank_enabled?'⚡ Đối soát tự động đang bật. Khi ngân hàng báo tiền vào, hệ thống sẽ tự ghi nhận học phí.':'QR đã dùng được. Hiện đối soát tự động chưa bật; admin vẫn có thể xác nhận thủ công.'}</div>
    <button class="btn primary full" style="margin-top:10px" onclick="refreshPaymentOrder('${order.id}','${pid}',${studentId?`'${studentId}'`:'null'})">🔄 Kiểm tra đã nhận tiền</button>
    <button class="btn full" style="margin-top:8px" onclick="confirmBankPaymentManual('${pid}',${order.expected_amount},${studentId?`'${studentId}'`:'null'},'${order.id}')">Xác nhận chuyển khoản thủ công</button>
  </div>`;
}

async function refreshPaymentOrder(orderId,pid,studentId=null){
  const {data:o,error}=await supa.from('payment_orders').select('status,paid_amount,expected_amount').eq('id',orderId).single();
  if(error)return alert(error.message);
  if(o.status==='paid'){
    alert('✅ Đã nhận thanh toán '+money(o.paid_amount||o.expected_amount));
    return studentId?openStudent(studentId):openFinance();
  }
  alert(o.status==='partial'?'Đã nhận một phần: '+money(o.paid_amount||0):'Chưa thấy giao dịch khớp.');
}

async function confirmBankPaymentManual(pid,due,studentId=null,orderId=null){
  if(!admin())return;
  let a=Number(prompt('Số tiền thực tế đã nhận, tối đa '+money(due),String(Math.round(due)))||0);
  if(a<=0)return; if(a>due)a=due;
  const {data,error}=await supa.from('payments').insert({purchase_id:pid,amount:a,method:'Chuyển khoản thủ công',source:'manual_bank',payment_order_id:orderId||null}).select().single();
  if(error)return alert(error.message);
  if(orderId)await supa.from('payment_orders').update({status:a>=due?'paid':'partial',paid_amount:a,paid_at:new Date().toISOString()}).eq('id',orderId);
  await audit('payment','purchase',pid,{payment_id:data.id,amount:a,method:'manual_bank'});
  alert('Đã ghi nhận chuyển khoản.'); return studentId?openStudent(studentId):openFinance();
}

function v12DateVN(d){if(!d)return '';try{return new Date(d+'T00:00:00').toLocaleDateString('vi-VN')}catch(_){return d}}
async function v12MyStudent(){if(!profile||profile.role!=='student')return null;const {data}=await supa.from('students').select('*').eq('user_id',profile.id).maybeSingle();return data}
async function v12ParentStudents(){if(!profile||profile.role!=='parent')return [];try{await supa.rpc('auto_link_current_parent')}catch(_){}const {data}=await supa.from('guardian_students').select('student_id,students(*)').eq('guardian_user_id',profile.id);return (data||[]).map(x=>x.students).filter(Boolean)}
async function v12StudentClassIds(studentId){const {data}=await supa.from('enrollments').select('class_id').eq('student_id',studentId).eq('active',true);return [...new Set((data||[]).map(x=>x.class_id).filter(Boolean))]}

function v12RenderNav(){
 const nav=document.querySelector('.bottom'); if(!nav||!profile)return;
 const r=profile.role;
 if(r==='admin') nav.innerHTML=`<button class="nav" onclick="openHome()"><span>🏠</span>Trang chủ</button><button class="nav" onclick="openStudents()"><span>👧</span>Học viên</button><button class="nav" onclick="openSchedule()"><span>🗓️</span>Lịch</button><button class="nav" onclick="openAttendanceHub()"><span>✅</span>Điểm danh</button><button class="nav" onclick="openMore()"><span>⋯</span>Khác</button>`;
 else if(r==='teacher') nav.innerHTML=`<button class="nav" onclick="openHome()"><span>🏠</span>Trang chủ</button><button class="nav" onclick="openStudents()"><span>👥</span>Lớp tôi</button><button class="nav" onclick="openSchedule()"><span>🗓️</span>Lịch dạy</button><button class="nav" onclick="openAttendanceHub()"><span>✅</span>Điểm danh</button><button class="nav" onclick="openMore()"><span>👤</span>Cá nhân</button>`;
 else if(r==='student') nav.innerHTML=`<button class="nav" onclick="openHome()"><span>🏠</span>Trang chủ</button><button class="nav" onclick="openStudents()"><span>🪪</span>Hồ sơ</button><button class="nav" onclick="openSchedule()"><span>🗓️</span>Lịch học</button><button class="nav" onclick="openAttendanceHub()"><span>📋</span>Điểm danh</button><button class="nav" onclick="openMore()"><span>⋯</span>Khác</button>`;
 else nav.innerHTML=`<button class="nav" onclick="openHome()"><span>🏠</span>Trang chủ</button><button class="nav" onclick="openStudents()"><span>👧</span>Con tôi</button><button class="nav" onclick="openSchedule()"><span>🗓️</span>Lịch học</button><button class="nav" onclick="openAttendanceHub()"><span>📝</span>Báo nghỉ</button><button class="nav" onclick="openMore()"><span>⋯</span>Khác</button>`;
}

const v12OldBoot=boot;
boot=async function(){await v12OldBoot();if(profile){$('roleText').textContent=`Vai trò: ${v12RoleLabel(profile.role)} · ${profile.status}`;v12RenderNav();}}

const v12AdminHome=openHome;
openHome=async function(){
 if(!active())return v12AdminHome();
 if(profile.role==='admin')return v12AdminHome();
 if(profile.role==='teacher'){
   const {data:classes,error}=await supa.from('classes').select('id,name,level,capacity').eq('teacher_user_id',profile.id).eq('active',true).order('name');
   if(error)return alert(error.message);
   const ids=(classes||[]).map(c=>c.id); let sessions=[];
   if(ids.length){const today=new Date().toISOString().slice(0,10);const {data}=await supa.from('class_sessions').select('id,class_id,session_date,start_time,end_time,status,rooms(name),classes(name)').in('class_id',ids).gte('session_date',today).neq('status','cancelled').order('session_date').order('start_time').limit(5);sessions=data||[]}
   $('content').innerHTML=`<div class="card"><h2>Xin chào ${esc(profile.full_name)}</h2><div class="muted">Giáo viên · ${classes?.length||0} lớp đang phụ trách</div></div><div class="card"><div class="row"><h2>Lịch dạy sắp tới</h2><button class="btn" onclick="openSchedule()">Xem lịch</button></div>${sessions.map(x=>`<div class="item"><div class="row"><div><b>${esc(x.classes?.name||'')}</b><div class="muted">${v12DateVN(x.session_date)} · ${(x.start_time||'').slice(0,5)}–${(x.end_time||'').slice(0,5)}${x.rooms?.name?' · '+esc(x.rooms.name):''}</div></div><button class="btn primary" onclick="openClassAttendance('${x.class_id}','${x.session_date}','${x.id}')">Điểm danh</button></div></div>`).join('')||'<div class="muted">Chưa có buổi học sắp tới.</div>'}</div><div class="card"><h2>Lớp của tôi</h2>${(classes||[]).map(c=>`<div class="item"><div class="row"><div><b>${esc(c.name)}</b><div class="muted">${esc(c.level||'')} ${c.capacity?'· tối đa '+c.capacity+' HV':''}</div></div><button class="btn" onclick="v12OpenTeacherClass('${c.id}')">Mở lớp</button></div></div>`).join('')||'<div class="muted">Chưa được phân công lớp.</div>'}</div>`;return;
 }
 if(profile.role==='student'){
   const s=await v12MyStudent(); if(!s){$('content').innerHTML='<div class="card"><h2>Chưa liên kết hồ sơ</h2><div class="muted">Quản trị viên cần liên kết tài khoản này với hồ sơ học viên.</div></div>';return}
   const {data:enrs}=await supa.from('enrollments').select('id,class_id,classes(name,level)').eq('student_id',s.id).eq('active',true);
   const {data:packs}=await supa.from('package_purchases').select('id,package_name_snapshot,price_snapshot,end_date,total_uses,remaining_uses,status,payments(amount)').eq('student_id',s.id).order('created_at',{ascending:false}).limit(5);
   const classIds=(enrs||[]).map(x=>x.class_id);let next=[];if(classIds.length){const today=new Date().toISOString().slice(0,10);const {data}=await supa.from('class_sessions').select('session_date,start_time,end_time,class_id,classes(name),rooms(name)').in('class_id',classIds).gte('session_date',today).eq('status','planned').order('session_date').order('start_time').limit(3);next=data||[]}
   $('content').innerHTML=`<div class="card"><h2>${esc(s.full_name)}</h2><div class="muted">Học viên${s.age?' · '+s.age+' tuổi':''}</div></div><div class="card"><h2>Lịch học sắp tới</h2>${next.map(x=>`<div class="item"><b>${esc(x.classes?.name||'')}</b><div class="muted">${v12DateVN(x.session_date)} · ${(x.start_time||'').slice(0,5)}–${(x.end_time||'').slice(0,5)}${x.rooms?.name?' · '+esc(x.rooms.name):''}</div></div>`).join('')||'<div class="muted">Chưa có lịch học sắp tới.</div>'}</div><div class="card"><h2>Gói học</h2>${(packs||[]).map(p=>{const paid=(p.payments||[]).reduce((a,b)=>a+Number(b.amount||0),0),due=Math.max(0,Number(p.price_snapshot||0)-paid);return `<div class="item"><b>${esc(p.package_name_snapshot||'')}</b><div class="small">${p.remaining_uses!=null?'Còn '+p.remaining_uses+'/'+p.total_uses+' buổi · ':''}Hạn ${p.end_date?v12DateVN(p.end_date):'không giới hạn'}</div><div class="small">Học phí còn thiếu: <b>${money(due)}</b></div>${due>0?`<button class="btn primary full" style="margin-top:8px" onclick="openPaymentQR('${p.id}','${s.id}')">📱 QR thanh toán</button>`:''}</div>`}).join('')||'<div class="muted">Chưa có gói học.</div>'}</div>`;return;
 }
 const kids=await v12ParentStudents();
 $('content').innerHTML=`<div class="card"><h2>${esc(profile.full_name)}</h2><div class="muted">Phụ huynh · ${kids.length} học viên đã liên kết</div></div><div class="card"><h2>Học viên của tôi</h2>${kids.map(s=>`<div class="item"><div class="row"><div><b>${esc(s.full_name)}</b><div class="muted">${s.age?s.age+' tuổi':''}</div></div><button class="btn" onclick="v12OpenFamilyStudent('${s.id}')">Hồ sơ</button></div><div class="grid" style="margin-top:8px"><button class="btn" onclick="showAbsenceRequest('${s.id}')">📝 Báo nghỉ</button><button class="btn primary" onclick="v12OpenStudentPayments('${s.id}')">💳 Học phí</button></div></div>`).join('')||'<div class="muted">Chưa liên kết học viên.</div>'}</div>`;
}

async function v12OpenTeacherClass(classId){
 if(profile.role!=='teacher')return;
 const [{data:c},{data:e}]=await Promise.all([supa.from('classes').select('id,name,level,capacity').eq('id',classId).eq('teacher_user_id',profile.id).single(),supa.from('enrollments').select('id,student_id,students(full_name,age)').eq('class_id',classId).eq('active',true).order('created_at')]);
 $('content').innerHTML=`<div class="card"><div class="row"><div><h2>${esc(c?.name||'Lớp học')}</h2><div class="muted">${esc(c?.level||'')} · ${e?.length||0} học viên</div></div><button class="btn primary" onclick="openClassAttendance('${classId}')">Điểm danh</button></div></div><div class="card"><h2>Danh sách học viên</h2>${(e||[]).map(x=>`<div class="item"><b>${esc(x.students?.full_name||'')}</b><div class="muted">${x.students?.age?x.students.age+' tuổi':''}</div></div>`).join('')||'<div class="muted">Chưa có học viên.</div>'}</div>`;
}

async function v12OpenFamilyStudent(studentId){return openStudent(studentId)}

const v12AdminStudents=openStudents;
openStudents=async function(){
 if(!active())return;
 if(profile.role==='admin')return v12AdminStudents();
 if(profile.role==='teacher'){
   const {data:classes}=await supa.from('classes').select('id,name,level').eq('teacher_user_id',profile.id).eq('active',true).order('name');
   $('content').innerHTML=`<div class="card"><h2>Lớp của tôi</h2>${(classes||[]).map(c=>`<div class="item"><div class="row"><div><b>${esc(c.name)}</b><div class="muted">${esc(c.level||'')}</div></div><button class="btn primary" onclick="v12OpenTeacherClass('${c.id}')">Mở</button></div></div>`).join('')||'<div class="muted">Chưa có lớp.</div>'}</div>`;return;
 }
 if(profile.role==='student'){const s=await v12MyStudent();if(!s)return openHome();return openStudent(s.id)}
 const kids=await v12ParentStudents();$('content').innerHTML=`<div class="card"><h2>Học viên của tôi</h2>${kids.map(s=>`<div class="item"><div class="row"><div><b>${esc(s.full_name)}</b><div class="muted">${s.age?s.age+' tuổi':''}</div></div><button class="btn" onclick="v12OpenFamilyStudent('${s.id}')">Mở</button></div></div>`).join('')||'<div class="muted">Chưa liên kết học viên.</div>'}</div>`;
}

const v12AdminSchedule=openSchedule;
openSchedule=async function(){
 if(!active())return;
 if(profile.role==='admin')return v12AdminSchedule();
 let classIds=[];
 if(profile.role==='teacher'){const {data}=await supa.from('classes').select('id').eq('teacher_user_id',profile.id).eq('active',true);classIds=(data||[]).map(x=>x.id)}
 if(profile.role==='student'){const s=await v12MyStudent();if(s)classIds=await v12StudentClassIds(s.id)}
 if(profile.role==='parent'){const kids=await v12ParentStudents();for(const s of kids)classIds.push(...await v12StudentClassIds(s.id));classIds=[...new Set(classIds)]}
 if(!classIds.length){$('content').innerHTML='<div class="card"><h2>Lịch học</h2><div class="muted">Chưa có lịch.</div></div>';return}
 const today=new Date().toISOString().slice(0,10);const {data,error}=await supa.from('class_sessions').select('id,class_id,session_date,start_time,end_time,status,classes(name),rooms(name)').in('class_id',classIds).gte('session_date',today).neq('status','cancelled').order('session_date').order('start_time').limit(60);if(error)return alert(error.message);
 $('content').innerHTML=`<div class="card"><h2>${profile.role==='teacher'?'Lịch dạy':'Lịch học'}</h2>${(data||[]).map(x=>`<div class="item"><div class="row"><div><b>${esc(x.classes?.name||'')}</b><div class="muted">${v12DateVN(x.session_date)} · ${(x.start_time||'').slice(0,5)}–${(x.end_time||'').slice(0,5)}${x.rooms?.name?' · '+esc(x.rooms.name):''}</div></div><span class="badge ${x.status==='completed'?'ok':''}">${x.status==='completed'?'Đã học':'Sắp tới'}</span></div>${profile.role==='teacher'?`<button class="btn primary full" style="margin-top:8px" onclick="openClassAttendance('${x.class_id}','${x.session_date}','${x.id}')">✅ Điểm danh</button>`:''}</div>`).join('')||'<div class="muted">Chưa có lịch.</div>'}</div>`;
}

async function v12AttendanceHistory(studentId,title='Lịch sử điểm danh'){
 const {data,error}=await supa.from('attendance').select('attendance_date,status,classes(name)').eq('student_id',studentId).order('attendance_date',{ascending:false}).limit(60);if(error)return alert(error.message);
 const labels={present:'Có mặt',late:'Đi muộn',absent:'Vắng',excused:'Nghỉ phép'};
 $('content').innerHTML=`<div class="card"><h2>${esc(title)}</h2>${(data||[]).map(a=>`<div class="item"><div class="row"><div><b>${esc(a.classes?.name||'')}</b><div class="muted">${v12DateVN(a.attendance_date)}</div></div><span class="badge ${['present','late'].includes(a.status)?'ok':a.status==='absent'?'danger':'warn'}">${labels[a.status]||esc(a.status)}</span></div></div>`).join('')||'<div class="muted">Chưa có dữ liệu điểm danh.</div>'}</div>`;
}

const v12AdminAttendanceHub=openAttendanceHub;
openAttendanceHub=async function(){
 if(!active())return;
 if(['admin','teacher'].includes(profile.role))return v12AdminAttendanceHub();
 if(profile.role==='student'){const s=await v12MyStudent();if(!s)return openHome();return v12AttendanceHistory(s.id,'Điểm danh của tôi')}
 const kids=await v12ParentStudents();$('content').innerHTML=`<div class="card"><h2>Báo nghỉ & điểm danh</h2>${kids.map(s=>`<div class="item"><b>${esc(s.full_name)}</b><div class="grid" style="margin-top:8px"><button class="btn primary" onclick="showAbsenceRequest('${s.id}')">📝 Báo nghỉ</button><button class="btn" onclick="v12AttendanceHistory('${s.id}','Điểm danh - ${esc(s.full_name)}')">📋 Lịch sử</button></div></div>`).join('')||'<div class="muted">Chưa liên kết học viên.</div>'}</div>`;
}

async function v12OpenStudentPayments(studentId){
 const {data:s}=await supa.from('students').select('full_name').eq('id',studentId).single();const {data:packs,error}=await supa.from('package_purchases').select('id,package_name_snapshot,price_snapshot,status,end_date,payments(amount,paid_at,method)').eq('student_id',studentId).order('created_at',{ascending:false});if(error)return alert(error.message);
 $('content').innerHTML=`<div class="card"><h2>Học phí · ${esc(s?.full_name||'')}</h2>${(packs||[]).map(p=>{const paid=(p.payments||[]).reduce((a,b)=>a+Number(b.amount||0),0),due=Math.max(0,Number(p.price_snapshot||0)-paid);return `<div class="item"><div class="row"><div><b>${esc(p.package_name_snapshot||'')}</b><div class="muted">Đã thu ${money(paid)} · còn ${money(due)}</div></div><span class="badge ${due<=0?'ok':'warn'}">${due<=0?'Đã đủ':'Còn nợ'}</span></div>${due>0?`<button class="btn primary full" style="margin-top:8px" onclick="openPaymentQR('${p.id}','${studentId}')">📱 QR thanh toán</button>`:''}</div>`}).join('')||'<div class="muted">Chưa có học phí.</div>'}</div>`;
}

const v12AdminMore=openMore;
openMore=async function(){
 if(!active())return;
 if(profile.role==='admin'){$('content').innerHTML=`<div class="card"><h2>Chức năng khác</h2><div class="stack" style="margin-top:10px"><button class="btn" onclick="openPackages()">📦 Gói học</button><button class="btn" onclick="openFinance()">💳 Học phí</button><button class="btn" onclick="openBankSettings()">🏦 Ngân hàng & QR</button><button class="btn" onclick="openReports()">📊 Báo cáo</button><button class="btn" onclick="openRoomsAdmin()">🏠 Phòng học</button><button class="btn" onclick="openAccounts()">👤 Tài khoản</button><button class="btn" onclick="openSettings()">⚙️ Cài đặt</button><button class="btn" onclick="openSystemCheck()">🩺 Kiểm tra hệ thống</button></div></div>`;return}

// ===== V12.2 ACCOUNT MANAGER =====
async function v121OpenAccounts(){
  if(!admin()) return;
  const [{data:profiles,error:pErr},{data:reqs,error:rErr}]=await Promise.all([
    supa.from('profiles').select('id,full_name,phone,role,status,created_at').order('created_at',{ascending:false}),
    supa.from('account_requests').select('id,user_id,requested_name,phone,status,created_at').order('created_at',{ascending:false}).limit(50)
  ]);
  if(pErr) return alert(pErr.message);
  if(rErr) console.warn(rErr);
  const ps=profiles||[], pending=(reqs||[]).filter(x=>x.status==='pending');
  const counts={teacher:0,student:0,disabled:0};
  ps.forEach(p=>{if(counts[p.role]!=null)counts[p.role]++;if(p.status==='disabled')counts.disabled++});
  $('content').innerHTML=`
    <div class="card">
      <div class="row"><div><h2>Quản lý tài khoản</h2><div class="muted">Tạo, duyệt, khóa và liên kết tài khoản</div></div><button class="btn primary" onclick="v121ShowCreateAccount()">+ Tạo</button></div>
      <div class="grid" style="margin-top:12px">
        <div class="kpi"><span class="muted">Giáo viên</span><b>${counts.teacher}</b></div>
        <div class="kpi"><span class="muted">Học viên</span><b>${counts.student}</b></div>
        
        <div class="kpi"><span class="muted">Chờ duyệt</span><b>${pending.length}</b></div>
      </div>
      <div class="toolbar" style="margin-top:10px"><button class="btn" onclick="openUnlinkedAccounts()">🔗 Chưa liên kết</button>${pending.length?`<button class="btn" onclick="v121ShowPending()">⏳ Duyệt ${pending.length}</button>`:''}</div>
    </div>
    <div class="card"><h2>Danh sách tài khoản</h2>
      ${ps.map(p=>`<div class="item"><div class="row"><div><b>${esc(p.full_name)}</b><div class="muted">${v12RoleLabel(p.role)}${p.phone?' · '+esc(p.phone):''}</div></div><span class="badge ${p.status==='active'?'ok':p.status==='disabled'?'danger':'warn'}">${p.status==='active'?'Hoạt động':p.status==='disabled'?'Đã khóa':p.status==='pending'?'Chờ duyệt':'Từ chối'}</span></div>

async function v121CreateAccount(){
  if(!admin())return;
  const full_name=($('aName')?.value||'').trim(),email=($('aEmail')?.value||'').trim(),password=$('aPass')?.value||'',phone=($('aPhone')?.value||'').trim(),role=$('aRole')?.value||'student';
  if(!full_name||!email||!password)return alert('Nhập họ tên, email và mật khẩu.');
  if(password.length<6)return alert('Mật khẩu tối thiểu 6 ký tự.');
  if(!['teacher','student','parent'].includes(role))return alert('Vai trò không hợp lệ.');
  const btn=$('aCreateBtn'); if(btn){btn.disabled=true;btn.textContent='Đang tạo…'}
  let temp=null;
  try{
    // Dùng client phụ chỉ để tạo Supabase Auth user, không làm mất phiên đăng nhập Admin hiện tại.
    temp=supabase.createClient(DANCE_CONFIG.SUPABASE_URL,DANCE_CONFIG.SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
    const {data,error}=await temp.auth.signUp({email,password,options:{data:{full_name}}});
    if(error)throw error;
    if(!data?.user?.id)throw new Error('Không tạo được người dùng Auth.');

    // Profile + role chỉ được kích hoạt bằng RPC SECURITY DEFINER và xác thực người gọi là Admin.
    const {error:pErr}=await supa.rpc('admin_activate_auth_account',{
      p_user_id:data.user.id,
      p_full_name:full_name,
      p_phone:phone||null,
      p_role:role
    });
    if(pErr)throw pErr;

    const studentId=$('aStudent')?.value||'',classId=$('aClass')?.value||'';
    if(role==='student'&&studentId){const {error}=await supa.rpc('admin_link_student_account',{p_user_id:data.user.id,p_student_id:studentId});if(error)throw error}
    if(role==='parent'&&studentId){const {error}=await supa.rpc('admin_link_parent_account',{p_user_id:data.user.id,p_student_id:studentId});if(error)throw error}
    if(role==='teacher'&&classId){const {error}=await supa.from('classes').update({teacher_user_id:data.user.id}).eq('id',classId);if(error)throw error}

    await audit('create','profile',data.user.id,{role,created_by_admin:true});
    if(data.session){await temp.auth.signOut().catch(()=>{});alert('Đã tạo tài khoản '+v12RoleLabel(role)+'.');}
    else alert('Đã tạo tài khoản '+v12RoleLabel(role)+'. Supabase đang bật xác nhận email, người dùng cần xác nhận email trước khi đăng nhập.');
    openAccounts();
  }catch(e){
    console.error(e);
    const msg=e?.message||'Không thể tạo tài khoản.';
    if(msg.includes('admin_activate_auth_account')) alert('Backend quản lý tài khoản chưa được cài. Hãy chạy SQL V12.2 Account Fix rồi thử lại.');
    else alert(msg);
  }finally{
    try{if(temp)await temp.auth.signOut()}catch(_){ }
    if(btn){btn.disabled=false;btn.textContent='Tạo tài khoản'}
  }
}

async function v121SaveAccount(uid){

async function v121AssignTeacher(uid){

}
async function v121SaveTeacherClasses(uid){
  const checked=[...document.querySelectorAll('.tClass:checked')].map(x=>x.value), all=[...document.querySelectorAll('.tClass')].map(x=>x.value);
  if(all.length){
    const remove=all.filter(id=>!checked.includes(id));
    if(remove.length){const {error}=await supa.from('classes').update({teacher_user_id:null}).in('id',remove).eq('teacher_user_id',uid);if(error)return alert(error.message)}
    if(checked.length){const {error}=await supa.from('classes').update({teacher_user_id:uid}).in('id',checked);if(error)return alert(error.message)}
  }
  await audit('assign','teacher_classes',uid,{class_ids:checked});alert('Đã lưu phân lớp.');openAccounts();
}

<script>
// ===== V12.7 · PRIVATE 1:1 LESSON CENTER =====
const V127_VERSION='12.7.0';
function v127Status(s){return ({pending_teacher:'Chờ giáo viên',confirmed:'Đã xác nhận',teacher_declined:'GV từ chối',center_proposed:'Có phương án mới',student_accepted:'HV đã đồng ý',completed:'Đã học',cancelled:'Đã hủy',no_show:'Vắng',refund_pending:'Chờ hoàn tiền',refunded:'Đã hoàn tiền',booked:'Đã đặt'})[s]||s||''}
function v127StatusClass(s){return ['confirmed','completed'].includes(s)?'ok':['teacher_declined','cancelled','no_show'].includes(s)?'danger':['pending_teacher','center_proposed','refund_pending'].includes(s)?'warn':''}
function v127Time(t){return (t||'').slice(0,5)}
async function v127ManagedStudents(){try{return await v124ManagedStudents()}catch(_){const s=await v12MyStudent();return s?[s]:[]}}

const v127MoreBase=openMore;
openMore=async function(){
 if(!active())return;
 if(profile?.role==='admin'){
   await v127MoreBase();
   const box=$('content')?.querySelector('.stack'); if(box)box.insertAdjacentHTML('afterbegin',`<button class="btn" onclick="v127Hub()">🤝 Học 1:1</button>`);return;
 }
 if(profile?.role==='teacher'){
   await v127MoreBase();
   const box=$('content')?.querySelector('.stack'); if(box)box.insertAdjacentHTML('afterbegin',`<button class="btn" onclick="v127Hub()">🤝 Lớp 1:1</button>`);return;
 }
 if(v125IsLearner()){
   await v127MoreBase();
   const box=$('content')?.querySelector('.stack'); if(box)box.insertAdjacentHTML('afterbegin',`<button class="btn primary" onclick="v127Hub()">🤝 Học kèm 1:1</button>`);return;
 }
 return v127MoreBase();

async function v127Hub(){

 if(profile.role==='teacher')return v127TeacherHub();

async function v127LearnerHub(){
 const ss=await v127ManagedStudents();
 if(!ss.length){$('content').innerHTML='<div class="card"><h2>Học kèm 1:1</h2><div class="muted">Hãy tạo hồ sơ học viên trước.</div></div>';return}
 const ids=ss.map(x=>x.id);
 const {data,error}=await supa.from('one_to_one_bookings').select('id,student_id,class_id,teacher_user_id,purchase_id,lesson_date,start_time,end_time,status,note,teacher_decline_reason,classes(name),profiles!one_to_one_bookings_teacher_user_id_fkey(full_name)').in('student_id',ids).order('lesson_date',{ascending:false}).order('start_time',{ascending:false}).limit(60);
 if(error)return alert(error.message);
 const names=Object.fromEntries(ss.map(s=>[s.id,s.full_name]));
 $('content').innerHTML=`<div class="card"><div class="row"><div><h2>🤝 Học kèm 1:1</h2><div class="muted">Bạn chọn ngày giờ, giáo viên xác nhận.</div></div><button class="btn primary" onclick="v127NewRequest()">+ Đăng ký</button></div></div><div class="card"><h2>Yêu cầu của tôi</h2>${(data||[]).map(b=>v127BookingCard(b,names[b.student_id],true)).join('')||'<div class="muted">Chưa có yêu cầu 1:1.</div>'}</div>`;
}

function v127BookingCard(b,studentName,learner=false){
 const teacher=b.profiles?.full_name||'Giáo viên';
 return `<div class="item"><div class="row"><div><b>${esc(b.classes?.name||'Học 1:1')}</b><div class="muted">${esc(studentName||'')} · ${v12DateVN(b.lesson_date)} · ${v127Time(b.start_time)}–${v127Time(b.end_time)}</div><div class="small">GV: ${esc(teacher)}</div></div><span class="badge ${v127StatusClass(b.status)}">${esc(v127Status(b.status))}</span></div>${b.teacher_decline_reason?`<div class="notice warn" style="margin-top:8px">${esc(b.teacher_decline_reason)}</div>`:''}<div class="grid" style="margin-top:8px"><button class="btn" onclick="v127OpenBooking('${b.id}')">💬 Chi tiết & chat</button>${learner&&b.status==='center_proposed'?`<button class="btn primary" onclick="v127OpenBooking('${b.id}')">Xem đề xuất</button>`:''}</div></div>`;

async function v127NewRequest(){
 const ss=await v127ManagedStudents();
 const {data:offers,error}=await supa.from('one_to_one_offerings').select('id,class_id,teacher_user_id,default_duration_minutes,min_duration_minutes,max_duration_minutes,classes(name),profiles!one_to_one_offerings_teacher_user_id_fkey(full_name)').eq('active',true).order('created_at');
 if(error)return alert(error.message);
 if(!(offers||[]).length){$('content').innerHTML='<div class="card"><h2>Đăng ký 1:1</h2><div class="notice warn">Hiện chưa có giáo viên mở nhận lớp 1:1.</div><button class="btn full" style="margin-top:10px" onclick="v127Hub()">Quay lại</button></div>';return}
 const opts=(offers||[]).map(o=>`<option value="${o.id}" data-class="${o.class_id}" data-teacher="${o.teacher_user_id}" data-min="${o.min_duration_minutes||60}" data-max="${o.max_duration_minutes||120}" data-def="${o.default_duration_minutes||60}">${esc(o.classes?.name||'Lớp')} · ${esc(o.profiles?.full_name||'Giáo viên')}</option>`).join('');
 const today=new Date();today.setDate(today.getDate()+1);const min=today.toISOString().slice(0,10);
 $('content').innerHTML=`<div class="card"><div class="row"><h2>Đăng ký học 1:1</h2><button class="btn" onclick="v127Hub()">Quay lại</button></div><label>Học viên</label><select id="v127Student">${ss.map(s=>`<option value="${s.id}">${esc(s.full_name)}</option>`).join('')}</select><label>Môn · Giáo viên</label><select id="v127Offer" onchange="v127OfferChanged()">${opts}</select><label>Ngày học</label><input id="v127Date" type="date" min="${min}" value="${min}"><div class="grid"><div><label>Bắt đầu</label><input id="v127Start" type="time" value="18:00"></div><div><label>Thời lượng</label><select id="v127Duration"><option value="60">60 phút</option><option value="90">90 phút</option><option value="120">120 phút</option></select></div></div><label>Ghi chú</label><textarea id="v127Note" rows="3" placeholder="Mục tiêu học, nội dung muốn tập…"></textarea><button id="v127CreateBtn" class="btn primary full" style="margin-top:12px" onclick="v127CreateRequest()">Gửi yêu cầu cho giáo viên</button><div class="small muted" style="margin-top:8px">Giáo viên sẽ nhận hoặc từ chối. Nếu không phù hợp, trung tâm có thể đề xuất giáo viên/lịch khác.</div></div>`;
 v127OfferChanged();

function v127OfferChanged(){const o=$('v127Offer')?.selectedOptions?.[0];if(!o)return;const min=Number(o.dataset.min||60),max=Number(o.dataset.max||120),def=Number(o.dataset.def||60);const vals=[30,45,60,90,120].filter(x=>x>=min&&x<=max);$('v127Duration').innerHTML=vals.map(x=>`<option value="${x}" ${x===def?'selected':''}>${x} phút</option>`).join('')||`<option value="${def}">${def} phút</option>`}
async function v127CreateRequest(){

}

tn full" style="color:#b42318" onclick="v127CancelBooking('${id}')">Hủy yêu cầu 1:1</button>`}</div>`:''}<button class="btn full" onclick="v127Hub()">← Quay lại danh sách</button>`;

<script>
// ===== V12.4 · STUDENT MULTI-PROFILE · NO PARENT ROLE IN UI =====
const V124_VERSION='12.4.0';

// Backward compatibility: old parent accounts behave like student accounts,
// but the Parent role is no longer offered anywhere in the UI.
const v124OldRoleLabel=v12RoleLabel;
v12RoleLabel=function(role){
  if(role==='parent') return 'Học viên';
  return v124OldRoleLabel(role);
};

async function v124ManagedStudents(){
  if(!profile || !['student'].includes(profile.role)) return [];
  const byId=new Map();
  try{
    const {data:direct}=await supa.from('students').select('*').eq('user_id',profile.id);
    (direct||[]).forEach(s=>byId.set(s.id,s));
  }catch(_){}
  try{
    const {data:linked}=await supa.from('guardian_students').select('student_id,students(*)').eq('guardian_user_id',profile.id);
    (linked||[]).forEach(x=>{if(x.students)byId.set(x.students.id,x.students)});
  }catch(_){}
  return [...byId.values()].filter(Boolean);
}

async function v124StudentSummaryCard(s){
  const [{data:enrs},{data:packs}]=await Promise.all([
    supa.from('enrollments').select('id,class_id,classes(name,level)').eq('student_id',s.id).eq('active',true),
    supa.from('package_purchases').select('id,package_name_snapshot,price_snapshot,end_date,total_uses,remaining_uses,status,created_at,class_id,classes(name),payments(amount)').eq('student_id',s.id).neq('status','cancelled').order('created_at',{ascending:false}).limit(6)
  ]);
  const classIds=(enrs||[]).map(x=>x.class_id); let next=[];
  if(classIds.length){
    const today=new Date().toISOString().slice(0,10);
    const {data}=await supa.from('class_sessions').select('session_date,start_time,end_time,class_id,classes(name),rooms(name)').in('class_id',classIds).gte('session_date',today).eq('status','planned').order('session_date').order('start_time').limit(3);
    next=data||[];
  }
  return `<div class="card"><div class="row"><div><h2>${esc(s.full_name)}</h2><div class="muted">Hồ sơ học viên</div></div><button class="btn" onclick="openStudent('${s.id}')">Hồ sơ</button></div></div>
  <div class="card"><h2>Lịch học sắp tới</h2>${next.map(x=>`<div class="item"><b>${esc(x.classes?.name||'')}</b><div class="muted">${v12DateVN(x.session_date)} · ${(x.start_time||'').slice(0,5)}–${(x.end_time||'').slice(0,5)}${x.rooms?.name?' · '+esc(x.rooms.name):''}</div></div>`).join('')||'<div class="muted">Chưa có lịch học sắp tới.</div>'}</div>
  <div class="card"><h2>Gói học</h2>${(packs||[]).map(p=>{const paid=(p.payments||[]).reduce((a,b)=>a+Number(b.amount||0),0),due=Math.max(0,Number(p.price_snapshot||0)-paid),created=p.created_at?new Date(p.created_at):null,canCancel=!!(created&&Date.now()-created.getTime()<=12*60*60*1000&&paid<=0&&p.status==='active');return `<div class="item"><div class="row"><div><b>${esc(p.package_name_snapshot||'')}</b>${p.classes?.name?`<div class="muted">${esc(p.classes.name)}</div>`:''}</div><span class="badge ${due<=0?'ok':'warn'}">${due<=0?'Đã đủ':'Còn nợ'}</span></div><div class="small">${p.remaining_uses!=null?'Còn '+p.remaining_uses+'/'+p.total_uses+' buổi · ':''}Hạn ${p.end_date?v12DateVN(p.end_date):'không giới hạn'}</div><div class="small">Học phí còn thiếu: <b>${money(due)}</b></div>${due>0?`<button class="btn primary full" style="margin-top:8px" onclick="openPaymentQR('${p.id}','${s.id}')">📱 QR thanh toán</button>`:''}${canCancel?`<button class="btn full" style="margin-top:8px;color:#b42318" onclick="v1262CancelPurchase('${p.id}')">Hủy đăng ký · trong 12 giờ</button>`:''}</div>`}).join('')||'<div class="muted">Chưa có gói học.</div>'}</div>`;
}

const v124BaseHome=openHome;
openHome=async function(){
  if(!active()) return v124BaseHome();
  if(!['student'].includes(profile.role)) return v124BaseHome();
  const ss=await v124ManagedStudents();
  if(!ss.length){
    $('content').innerHTML='<div class="card"><h2>Chưa có hồ sơ học viên</h2><div class="muted">Tài khoản này chưa được gắn với hồ sơ nào.</div></div>';
    return;
  }
  if(ss.length===1){ $('content').innerHTML=await v124StudentSummaryCard(ss[0]); return; }
  $('content').innerHTML=`<div class="card"><h2>Học viên của tài khoản</h2><div class="muted">Một tài khoản có thể quản lý nhiều hồ sơ học viên.</div>${ss.map(s=>`<div class="item"><div class="row"><div><b>${esc(s.full_name)}</b><div class="muted">${s.student_type==='child'?'Đăng ký hộ':'Học viên'}</div></div><button class="btn primary" onclick="v124OpenManagedStudent('${s.id}')">Mở</button></div></div>`).join('')}</div>`;
};

async function v124OpenManagedStudent(id){
  const ss=await v124ManagedStudents();
  const s=ss.find(x=>x.id===id); if(!s)return alert('Không có quyền xem hồ sơ này.');
  $('content').innerHTML=await v124StudentSummaryCard(s);
}

const v124BaseStudents=openStudents;
openStudents=async function(){
  if(!active())return;
  if(!['student'].includes(profile.role))return v124BaseStudents();
  const ss=await v124ManagedStudents();
  $('content').innerHTML=`<div class="card"><div class="row"><div><h2>Hồ sơ học viên</h2><div class="muted">Hồ sơ của bạn và người được đăng ký hộ</div></div></div>${ss.map(s=>`<div class="item"><div class="row"><div><b>${esc(s.full_name)}</b><div class="muted">${s.student_type==='child'?'Đăng ký hộ':'Học viên'}</div></div><button class="btn" onclick="openStudent('${s.id}')">Mở</button></div></div>`).join('')||'<div class="muted">Chưa có hồ sơ.</div>'}</div>`;
};

const v124BaseSchedule=openSchedule;
openSchedule=async function(){
  if(!active())return;
  if(!['student'].includes(profile.role))return v124BaseSchedule();
  const ss=await v124ManagedStudents(); let classIds=[];
  for(const s of ss) classIds.push(...await v12StudentClassIds(s.id));
  classIds=[...new Set(classIds)];
  if(!classIds.length){$('content').innerHTML='<div class="card"><h2>Lịch học</h2><div class="muted">Chưa có lịch.</div></div>';return}
  const today=new Date().toISOString().slice(0,10);
  const {data,error}=await supa.from('class_sessions').select('id,class_id,session_date,start_time,end_time,status,classes(name),rooms(name)').in('class_id',classIds).gte('session_date',today).neq('status','cancelled').order('session_date').order('start_time').limit(60);
  if(error)return alert(error.message);
  $('content').innerHTML=`<div class="card"><h2>Lịch học</h2>${(data||[]).map(x=>`<div class="item"><div class="row"><div><b>${esc(x.classes?.name||'')}</b><div class="muted">${v12DateVN(x.session_date)} · ${(x.start_time||'').slice(0,5)}–${(x.end_time||'').slice(0,5)}${x.rooms?.name?' · '+esc(x.rooms.name):''}</div></div><span class="badge ${x.status==='completed'?'ok':''}">${x.status==='completed'?'Đã học':'Sắp tới'}</span></div></div>`).join('')||'<div class="muted">Chưa có lịch.</div>'}</div>`;
};

const v124BaseAttendance=openAttendanceHub;
openAttendanceHub=async function(){
  if(!active())return;
  if(!['student'].includes(profile.role))return v124BaseAttendance();
  const ss=await v124ManagedStudents();
  if(ss.length===1)return v12AttendanceHistory(ss[0].id,'Điểm danh · '+ss[0].full_name);
  $('content').innerHTML=`<div class="card"><h2>Điểm danh</h2>${ss.map(s=>`<div class="item"><div class="row"><b>${esc(s.full_name)}</b><button class="btn" onclick="v12AttendanceHistory('${s.id}','Điểm danh · ${esc(s.full_name)}')">Lịch sử</button></div></div>`).join('')||'<div class="muted">Chưa có hồ sơ.</div>'}</div>`;
};

const v124BaseMore=openMore;
openMore=async function(){
  if(!active())return;
  if(!['student'].includes(profile.role))return v124BaseMore();
  const ss=await v124ManagedStudents();
  $('content').innerHTML=`<div class="card"><h2>Chức năng</h2><div class="stack"><button class="btn" onclick="openStudents()">🪪 Hồ sơ học viên</button>${ss.length?`<button class="btn" onclick="v124PaymentsChooser()">💳 Học phí & QR</button>`:''}<button class="btn" onclick="openAttendanceHub()">📋 Lịch sử điểm danh</button><button class="btn" onclick="v12OpenMyAccount()">👤 Tài khoản của tôi</button></div></div>`;
};

async function v124PaymentsChooser(){
  const ss=await v124ManagedStudents();
  if(ss.length===1)return v12OpenStudentPayments(ss[0].id);
  $('content').innerHTML=`<div class="card"><h2>Chọn học viên</h2>${ss.map(s=>`<div class="item"><div class="row"><b>${esc(s.full_name)}</b><button class="btn primary" onclick="v12OpenStudentPayments('${s.id}')">Học phí</button></div></div>`).join('')}</div>`;
}

// Admin account manager: only Teacher and Student are offered.
const v124BaseAccounts=v121OpenAccounts;
v121OpenAccounts=async function(){
  await v124BaseAccounts();
  if(!admin())return;
  // Hide legacy Parent KPI/card semantics by renaming it as legacy only if present.
  document.querySelectorAll('.kpi').forEach(k=>{if((k.textContent||'').includes('Phụ huynh'))k.style.display='none'});
};

const v124BaseShowCreate=v121ShowCreateAccount;
v121ShowCreateAccount=async function(){
  await v124BaseShowCreate();
  const role=$('aRole'); if(role){
    [...role.options].forEach(o=>{if(o.value==='parent')o.remove()});
    if(role.value==='parent')role.value='student';
    v121RoleFields();
  }
};

const v124BaseRoleFields=v121RoleFields;
v121RoleFields=function(){
  const role=$('aRole')?.value, area=$('aLinkArea'); if(!area)return;
  if(role==='student') area.innerHTML=`<label>Gắn hồ sơ học viên ban đầu</label><select id="aStudent"><option value="">Để gắn sau</option>${(window._v121Students||[]).map(s=>`<option value="${s.id}">${esc(s.full_name)}</option>`).join('')}</select><div class="notice" style="margin-top:8px">Sau khi tạo, có thể gắn thêm nhiều học viên vào cùng tài khoản.</div>`;
  else return v124BaseRoleFields();
};

// Replace the old link prompt for student accounts with multi-profile linking.
const v124OldLinkAccountPrompt=linkAccountPrompt;
linkAccountPrompt=async function(uid,role){
  if(role==='student') return v124ShowAttachStudent(uid);
  return v124OldLinkAccountPrompt(uid,role);
};

async function v124ShowAttachStudent(uid){
  if(!admin())return;
  const {data,error}=await supa.from('students').select('id,full_name,student_type,active').eq('active',true).order('full_name');
  if(error)return alert(error.message);
  $('content').innerHTML=`<div class="card"><div class="row"><div><h2>Gắn học viên</h2><div class="muted">Một tài khoản có thể quản lý nhiều hồ sơ.</div></div><button class="btn" onclick="openAccounts()">Quay lại</button></div>${(data||[]).map(s=>`<div class="item"><div class="row"><div><b>${esc(s.full_name)}</b><div class="muted">${s.student_type==='child'?'Đăng ký hộ':'Học viên'}</div></div><button class="btn primary" onclick="v124AttachStudent('${uid}','${s.id}')">Gắn</button></div></div>`).join('')||'<div class="muted">Chưa có học viên.</div>'}</div>`;
}
async function v124AttachStudent(uid,studentId){
  const {error}=await supa.rpc('admin_attach_student_account',{p_user_id:uid,p_student_id:studentId});
  if(error)return alert(error.message);

}

 }
 return v124BaseRenderNav();
